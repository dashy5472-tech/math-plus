<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>수학 역량 플러스 연습장</title>
<style>:root{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>수학 역량 플러스 연습장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: graph-paper study notebook. Phone = one column + bottom-sheet reading; tablet (>=900px) = reading left, activities right. */
:root{
  --bg:#eef1f5; --grid:rgba(60,84,140,.07); --surface:#ffffff; --surface-2:#f5f7fb;
  --ink:#1a2233; --muted:#5a6478; --line:#d6dce7;
  --accent:#2b44b8; --accent-soft:#e3e8fb; --on-accent:#ffffff;
  --mark:#ffe36b; --ok:#176841; --ok-soft:#dcf3e7; --bad:#b8402a; --bad-soft:#fbe5df; --line-ctl:#767f97;
  --review:#277743; --faint:#ad5847; --shade:rgba(60,84,140,.08);
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
  --r:12px; --head:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141b; --grid:rgba(140,160,220,.06); --surface:#191e28; --surface-2:#1f2532;
  --ink:#e5e9f2; --muted:#9aa3b6; --line:#2e3646;
  --accent:#8c9cff; --accent-soft:#252d4d; --on-accent:#10142a;
  --mark:rgba(255,214,60,.32); --ok:#5fcf95; --ok-soft:#173326; --bad:#ff8d74; --bad-soft:#3a2019; --line-ctl:#707d99;
  --review:#5fc07f; --faint:#d99484; --shade:rgba(140,160,220,.1); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141b; --grid:rgba(140,160,220,.06); --surface:#191e28; --surface-2:#1f2532;
  --ink:#e5e9f2; --muted:#9aa3b6; --line:#2e3646;
  --accent:#8c9cff; --accent-soft:#252d4d; --on-accent:#10142a;
  --mark:rgba(255,214,60,.32); --ok:#5fcf95; --ok-soft:#173326; --bad:#ff8d74; --bad-soft:#3a2019; --line-ctl:#707d99;
  --review:#5fc07f; --faint:#d99484; --shade:rgba(140,160,220,.1); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
u{text-decoration-thickness:1.5px;text-underline-offset:3px}
mjx-container{color:inherit}
mjx-container[display="true"]{display:block;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:4px 0;margin:0!important;scrollbar-width:thin}
@media (max-width:620px){mjx-container[display="true"]{font-size:82%}mjx-container:not([display]){font-size:94%}}
mjx-container:not([display]){display:inline-block;white-space:nowrap;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle;scrollbar-width:none;-ms-overflow-style:none}
mjx-container:not([display])::-webkit-scrollbar{width:0;height:0;display:none}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{height:var(--head);display:flex;align-items:center;gap:10px;max-width:1280px;margin:0 auto}
.back{min-width:44px;height:44px;border:0;background:none;border-radius:10px;display:grid;place-items:center;font-size:22px}
.back:hover{background:var(--surface-2)}
.top-title{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:0;align-items:center;flex-wrap:nowrap;justify-content:flex-end}
.prog{display:none;font:600 13px var(--f-num);color:var(--muted);white-space:nowrap;padding-left:6px}
@media (max-width:620px){.dots{display:none}}
.prog{display:block}
.dot{width:22px;height:40px;border:0;background:none;padding:0;display:grid;place-items:center}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dot.done::before{background:var(--ok);border-color:var(--ok)}
.dot.cur::before{outline:2px solid var(--accent);outline-offset:2px}

/* home */
.home{max-width:760px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--accent);font-weight:600}
.home h1{font-family:var(--f-display);font-size:clamp(26px,6vw,36px);font-weight:700}
.home .lede{color:var(--muted);max-width:60ch}
.topics{display:grid;gap:12px}
.tcard{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;min-height:88px}
.tcard:not(:disabled):hover{border-color:var(--accent)}
.tcard:disabled{cursor:default;opacity:.62}
.tcard svg{width:64px;height:48px;display:block}
.tcard h2{font-size:16.5px;font-weight:600}
.tcard .tags{font-size:13px;color:var(--muted)}
.tstate{font-size:12.5px;font-weight:600;white-space:nowrap;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tstate.go{background:var(--accent);color:var(--on-accent)}
.glyph path{fill:none;stroke:var(--accent);stroke-width:2}
.glyph .ax{stroke:var(--line);stroke-width:1.5}

/* intro */
.intro{max-width:760px;margin:0 auto;padding-block:22px 120px;display:flex;flex-direction:column;gap:20px}
.intro h1{font-family:var(--f-display);font-size:clamp(24px,5.5vw,32px)}
.meta-line{font-size:13.5px;color:var(--muted)}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:15px;margin-top:6px}
.goal b{color:var(--accent);margin-right:6px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.seg.cell button{min-height:44px;padding:0 12px;flex:1}
.seg.cell{display:flex;width:100%}
.seg.cell.ok{border-color:var(--ok)}.seg.cell.bad{border-color:var(--bad)}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px 14px 34px;margin:0;font-size:14.5px;display:grid;gap:6px}
.section-h{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.cta-row{display:flex;gap:10px;flex-wrap:wrap}

/* buttons */
.btn{min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}

/* reading */
.reading{display:flex;flex-direction:column;gap:14px;font-size:15.5px;line-height:1.75;min-width:0}
.reading p{overflow-wrap:anywhere}
.reading p{max-width:65ch}
.reading [data-ref]{border-radius:6px;transition:background-color .3s,box-shadow .3s}
.reading .hl{background:var(--mark);box-shadow:0 0 0 6px var(--mark)}
.formula{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;overflow-x:auto}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;font-size:14px;min-width:100%}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
table.tbl th{background:var(--surface-2);font-weight:600}
.src{font-size:12.5px;color:var(--muted)}
.box{border:1.5px solid var(--accent);background:var(--surface);border-radius:var(--r);padding:14px 16px;font-size:14.5px;display:block;line-height:1.75}
.box>*+*{margin-top:8px}
.box h4{font-size:14px;color:var(--accent)}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;display:grid;gap:6px}
figure>svg{width:100%;max-width:520px;height:auto;display:block;justify-self:center}
@media (max-width:899px){figure{padding:8px 6px 6px}.part>figure{margin-inline:-17px}}
figcaption mjx-container{display:inline-block!important;max-width:100%}
figcaption mjx-container>svg{width:auto;height:auto;display:inline-block}
figcaption{font-size:13px;color:var(--muted);line-height:1.5}
.fig-tools{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.ax{stroke:var(--ink);stroke-width:1.2}
.gl{stroke:var(--line);stroke-width:.8}
.tick{font-family:var(--f-body);font-weight:500;font-size:calc(10.5px*var(--u,1));fill:var(--muted)}
.vlab{font-family:var(--f-num);font-weight:600;font-size:calc(11px*var(--u,1));fill:var(--accent)}
.flab{font-family:var(--f-body);font-weight:700;font-size:calc(11.5px*var(--u,1));fill:var(--ink)}
.dlab{font-family:var(--f-body);font-weight:600;font-size:calc(10px*var(--u,1));fill:var(--faint)}
svg .note{font-family:var(--f-body);font-weight:500;font-size:calc(10.5px*var(--u,1));fill:var(--muted)}
p.note{display:block;font:inherit;font-size:14.5px;line-height:1.7;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;color:var(--ink)}
.curve{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.curve2{fill:none;stroke:var(--faint);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.faint{fill:none;stroke:var(--faint);stroke-width:1.4;stroke-dasharray:4 3}
.rise{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:4 3;opacity:.7}
.rev{stroke:var(--review);stroke-width:1;stroke-dasharray:3 3}
.revlab{font-family:var(--f-body);font-weight:700;font-size:calc(10px*var(--u,1));fill:var(--review)}
.asym{stroke:var(--faint);stroke-width:1.2;stroke-dasharray:5 3;fill:none}
.pt{fill:var(--accent)}
.op{fill:var(--surface);stroke:var(--accent);stroke-width:1.8}
.pt2{fill:var(--faint)}
.op2{fill:var(--surface);stroke:var(--faint);stroke-width:1.8}
.shade{fill:var(--shade)}
.lab{font-family:var(--f-body);font-weight:600;font-size:calc(11px*var(--u,1));fill:var(--ink)}
.lab2{font-family:var(--f-body);font-weight:600;font-size:calc(11px*var(--u,1));fill:var(--faint)}

/* work layout */
.work{max-width:1280px;margin:0 auto}
.acts{padding-block:18px 120px;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:86dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s ease;visibility:hidden}
.panel.open{transform:none;visibility:visible}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.panel-head b{font-size:15px}
.grab{position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line)}
.panel-body{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(10,14,25,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:80dvh;display:flex;flex-direction:column}
.toc-list{display:grid;gap:8px}
.toc-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;min-height:56px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:15px}
.toc-item[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.toc-item .ix{font:600 13px var(--f-num);color:var(--muted);min-width:22px}
.toc-item .st{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.toc-item .st.done{color:var(--ok)}
.toc-area{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--accent);margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.bar .btn:first-child{justify-self:start}.bar .btn:last-child{justify-self:end}
@media (min-width:900px){
  .work{display:grid;grid-template-columns:minmax(0,44fr) minmax(0,56fr);gap:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .work .acts{padding-left:0;padding-right:0;padding-bottom:40px}
  .panel{position:sticky;top:calc(var(--head) + env(safe-area-inset-top,0px));transform:none;visibility:visible;max-height:none;height:calc(100dvh - var(--head) - env(safe-area-inset-top,0px));border-radius:0;box-shadow:none;background:none;border-right:1px solid var(--line);z-index:1}
  .panel-head .closer,.grab,.scrim{display:none}
  .panel-body{padding:16px 22px 40px 0}
  .bar{position:static;background:none;border:0;padding:0}
  .bar .mid{visibility:hidden}
}

/* activity */
.area-head{display:grid;gap:4px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface)}
.area-head .area{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.03em;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.area-head .pts{font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:500}
.area-head p{font-size:13.5px;color:var(--muted)}
.act-head{display:grid;gap:6px}
.act-head h1{font-family:var(--f-display);font-size:clamp(22px,5vw,28px)}
.act-head h1 small{font-family:var(--f-body);font-size:15px;font-weight:500;color:var(--muted);margin-left:8px}
.act-prog{font-family:var(--f-body);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 10px;margin-left:10px;vertical-align:4px;white-space:nowrap}
.act-prog[data-full="1"]{color:var(--ok);background:var(--ok-soft)}
.lead{font-size:15.5px}
.quote{font-family:var(--f-display);font-size:17px;border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.part{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0;grid-template-columns:minmax(0,1fr)}
.part.solved{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.q{font-size:15.5px}
.q .no{font-weight:700;color:var(--accent);margin-right:4px}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.wr{background:var(--surface-2);color:var(--muted)}
.grid-head{font-size:13px;font-weight:600;color:var(--muted)}
.aside{font-size:14px;color:var(--ink);background:var(--mark);border-radius:8px;padding:10px 12px}
details.brief{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:0}
details.brief>summary{cursor:pointer;list-style:none;padding:11px 14px;font-size:14px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:8px;min-height:44px}
details.brief>summary::-webkit-details-marker{display:none}
details.brief>summary::after{content:"▾";margin-left:auto;transition:transform .2s}
details.brief[open]>summary::after{transform:rotate(180deg)}
details.brief>.brief-in{padding:0 10px 10px;display:grid;gap:10px}
details.brief .formula{background:var(--surface)}
details.brief figure{background:var(--surface)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.keys{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.keys>span{font-size:12.5px;color:var(--muted)}
.key{min-width:48px;min-height:44px;border:1.5px solid var(--line-ctl);border-radius:9px;background:var(--surface);font:600 18px var(--f-num);color:var(--ink)}
.key:hover{border-color:var(--accent)}
.ccard{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--surface-2);min-width:0}
.ccard h4{font-size:14px}
.fld{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.fld-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:15px}
.fld-row .lb{min-width:0}
.fields{display:grid;gap:10px}
.tpl{display:block;font-size:15px;line-height:2.4}
.tpl>span{display:inline}
.tpl input.num{display:inline-block;vertical-align:middle;margin:0 4px}
input.num{width:100%;max-width:120px;height:46px;border:1.5px solid var(--line-ctl);border-radius:9px;background:var(--surface);color:var(--ink);font:500 18px var(--f-num);text-align:center;padding:0 8px}
.fld-row input.num,.tpl input.num{width:104px}
input.num.ok{border-color:var(--ok);background:var(--ok-soft)}
input.num.bad{border-color:var(--bad);background:var(--bad-soft)}
.group{display:grid;gap:8px}
.group-l{font-size:14px;font-weight:600}
.group-l small{font-weight:500;color:var(--muted);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line-ctl);background:var(--surface);font-size:15px;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.chip.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.write{display:grid;gap:8px}
.write.need textarea{border-color:var(--bad);background:var(--bad-soft)}
.need-msg{font-size:14px;line-height:1.6;background:var(--mark);border-radius:8px;padding:10px 12px;color:var(--ink)}
.write-l{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--line-ctl);border-radius:10px}
.seg button:first-child{border-radius:9px 0 0 9px}
.seg button:last-child{border-radius:0 9px 9px 0}
.seg button{min-height:44px;padding:0 14px;border:0;background:var(--surface);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line-ctl);border-radius:10px;padding:12px;background:var(--surface);color:var(--ink);font:16px/1.6 var(--f-body);resize:vertical}
.paper{border:1.5px dashed var(--line);border-radius:10px;padding:14px;font-size:14.5px;color:var(--muted);background:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px)}

<script>
/* ===================== figures ===================== */
/* figs.js — 수행평가 연습장 그림(SVG) 모음
 * 브라우저 전역: FIGS[name]() → <svg …> 문자열, FIG_TITLES[name] → 확대 보기 제목.
 * 헬퍼는 모두 fig_ 접두어. 색은 CSS 변수(--accent --ink --muted --line --surface --faint --review)만 사용.
 * CSS 클래스(.ax .gl .tick .vlab .note .curve .faint .rise .rev .revlab .pt .op)는 study.html 의 정의를 따른다.
 * 좌표 출처: review/그래프_수식_검토.md (픽셀 환산값은 ≈, 판독 불확실 값은 // [불확실]).
 */
const FIGS = {};
const FIG_TITLES = {};

/* ---------- 공통 헬퍼 ---------- */
const fig_r1 = n => (Math.round(n*10)/10).toString();

// 데이터 범위 → viewBox 좌표
function fig_scale({x0=46,x1=352,y0=196,y1=28,xmin=0,xmax=1,ymin=0,ymax=1}){
  const X = x => x0 + (x-xmin)/(xmax-xmin)*(x1-x0);
  const Y = y => y0 - (y-ymin)/(ymax-ymin)*(y0-y1);
  return {X,Y,x0,x1,y0,y1,xmin,xmax,ymin,ymax, P: pts => pts.map(([x,y])=>[X(x),Y(y)])};
}

// 단조 3차 보간(화면 좌표) — study.html 의 mono() 와 동일
function fig_mono(pts){
  const n=pts.length, d=[], m=[];
  for(let i=0;i<n-1;i++) d.push((pts[i+1][1]-pts[i][1])/(pts[i+1][0]-pts[i][0]));
  m[0]=d[0]; m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++) m[i] = d[i-1]*d[i]<=0 ? 0 : (d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){ if(d[i]===0){m[i]=m[i+1]=0;continue}
    const a=m[i]/d[i], b=m[i+1]/d[i], s=a*a+b*b; if(s>9){const t=3/Math.sqrt(s); m[i]=t*a*d[i]; m[i+1]=t*b*d[i];}}
  let p=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){const h=(pts[i+1][0]-pts[i][0])/3;
    p+=` C${(pts[i][0]+h).toFixed(1)},${(pts[i][1]+m[i]*h).toFixed(1)} ${(pts[i+1][0]-h).toFixed(1)},${(pts[i+1][1]-m[i+1]*h).toFixed(1)} ${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`;}
  return p;
}

// 식 샘플링 → 폴리라인 path (데이터 좌표 fn, 구간 [a,b])
function fig_fnpath(s, fn, a, b, n=48){
  let d='';
  for(let i=0;i<=n;i++){const x=a+(b-a)*i/n; d+=(i?' L':'M')+s.X(x).toFixed(1)+','+s.Y(fn(x)).toFixed(1);}
  return d;
}
// 점 목록(데이터 좌표) → 폴리라인 path
function fig_poly(s, pts){
  return pts.map(([x,y],i)=>(i?'L':'M')+s.X(x).toFixed(1)+','+s.Y(y).toFixed(1)).join(' ');
}

// 수식 라벨: 이탤릭 변수 + 아래첨자 (SVG 안에서는 LaTeX 불가)
function fig_var(v, sub, size=12.5){
  const f=n=>`font-family:Times New Roman,serif;font-style:italic;font-size:calc(${n}px*var(--u,1))`;
  return `<tspan style="${f(size)}">${v}</tspan>`+
    (sub?`<tspan style="${f(fig_r1(size*.8))}" baseline-shift="sub">${sub}</tspan>`:'');
}
// 화살표 머리(오른쪽/위쪽)
const fig_arrowR = (x,y) => `<path d="M${x},${y} l-7,-3.2 v6.4 z" fill="var(--ink)"/>`;
const fig_arrowU = (x,y) => `<path d="M${x},${y} l-3.2,7 h6.4 z" fill="var(--ink)"/>`;

/* 축·격자 생성.
 * xt / yt: [[값, 라벨]] (라벨 '' 이면 눈금만). gridX / gridY: 격자 위치 배열(데이터 좌표).
 * arrows: 축 끝 화살표. xlab/ylab: 축 제목(원시 SVG 텍스트).
 */
function fig_axes(s, {xt=[], yt=[], gridX=[], gridY=[], arrows=false, xlab='', ylab='', xlabDy=25, ext=10, tickLen=3, origin=''}={}){
  let o='';
  gridY.forEach(v=>{o+=`<line class="gl" x1="${s.x0}" x2="${s.x1+ext-2}" y1="${fig_r1(s.Y(v))}" y2="${fig_r1(s.Y(v))}"/>`});
  gridX.forEach(v=>{o+=`<line class="gl" y1="${s.y0}" y2="${s.y1+12}" x1="${fig_r1(s.X(v))}" x2="${fig_r1(s.X(v))}"/>`});
  o+=`<line class="ax" x1="${s.x0}" y1="${s.y0}" x2="${s.x1+ext}" y2="${s.y0}"/><line class="ax" x1="${s.x0}" y1="${s.y0}" x2="${s.x0}" y2="${s.y1-12}"/>`;
  if(arrows) o+=fig_arrowR(s.x1+ext+1, s.y0)+fig_arrowU(s.x0, s.y1-13);
  xt.forEach(([v,l])=>{const x=fig_r1(s.X(v)); if(v!==s.xmin) o+=`<line class="ax" x1="${x}" x2="${x}" y1="${s.y0}" y2="${s.y0+tickLen}"/>`; if(l!=='') o+=`<text class="tick" x="${x}" y="${s.y0+13}" text-anchor="middle">${l}</text>`});
  yt.forEach(([v,l])=>{const y=fig_r1(s.Y(v)); if(v!==s.ymin) o+=`<line class="ax" y1="${y}" y2="${y}" x1="${s.x0-tickLen}" x2="${s.x0}"/>`; if(l!=='') o+=`<text class="tick" x="${s.x0-6}" y="${+y+3}" text-anchor="end">${l}</text>`});
  if(origin) o+=`<text class="tick" x="${s.x0-5}" y="${s.y0+11}" text-anchor="end">${origin}</text>`;
  if(ylab) o+=`<text class="tick" x="${s.x0-6}" y="${s.y1-14}">${ylab}</text>`;
  if(xlab) o+=`<text class="tick" x="${s.x1+ext}" y="${s.y0+xlabDy}" text-anchor="end">${xlab}</text>`;
  return o;
}
const FIG_U = 344;   // 390px 휴대폰에서 그림 svg 가 차지하는 폭(px). --u 로 글자 크기를 CSS px 로 고정한다.
const fig_open = (w,h,label,vy=0) => `<svg viewBox="0 ${vy} ${w} ${h}" style="--u:${(w/FIG_U).toFixed(4)}" role="img" aria-label="${label}">`;

/* =====================================================================
 * 05 망각곡선 — 기존 fig1/fig2 이관 (수정: '10년' 제거, '학습'은 상승선 옆 기울인 주석, 그림1 점은 ○ 스타일)
 * ===================================================================== */
const fig_fX = i => 46 + i*42, fig_fY = v => 196 - 1.68*v;
const fig_fP = arr => arr.map(([i,v])=>[fig_fX(i),fig_fY(v)]);
const FIG_FORGET_XL = ['','10분','1시간','1일','1주','1달','1년',''];   // 원점·오른쪽 끝은 라벨 없음
const FIG_FORGET_F1 = [[1,100],[2,50],[3,28],[4,23],[5,20],[6,17],[7,15]]; // 1년 ≈17, 오른쪽 끝 ≈15 (곡선에서 읽은 값)
function fig_forget_frame(){
  const X=fig_fX, Y=fig_fY; let s='';
  [20,40,60,80,100].forEach(v=>{s+=`<line class="gl" x1="${X(0)}" x2="${X(7)+8}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${X(0)-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`});
  s+=`<line class="ax" x1="${X(0)}" y1="${Y(0)}" x2="${X(7)+10}" y2="${Y(0)}"/><line class="ax" x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(100)-12}"/>`;
  FIG_FORGET_XL.forEach((t,i)=>{ if(t){ s+=`<line class="ax" x1="${X(i)}" x2="${X(i)}" y1="${Y(0)}" y2="${Y(0)+3}"/><text class="tick" x="${X(i)}" y="${Y(0)+13}" text-anchor="middle">${t}</text>`}});
  s+=`<text class="tick" x="${X(0)-6}" y="${Y(100)-14}">파지율(%)</text><text class="tick" x="${X(7)+10}" y="${Y(0)+28}" text-anchor="end">시간의 경과</text>`;
  // 학습 상승부(회색 점선) + 기울인 '학습' 주석
  s+=`<path class="rise" d="${fig_mono(fig_fP([[0,0],[0.5,62],[1,100]]))}"/>`;
  s+=`<text class="note" x="${X(0.42)-4}" y="${Y(52)}" text-anchor="middle" transform="rotate(-62 ${X(0.42)-4} ${Y(52)})">학습</text>`;
  return s;
}
FIGS.forget_1 = () => {
  const X=fig_fX, Y=fig_fY;
  let s=fig_open(370,250,'복습을 하지 않았을 때 파지율 그래프. 10분 100, 1시간 50, 1일 28, 1주 23, 1달 20, 이후 계속 천천히 줄어든다.',-18)+fig_forget_frame();
  s+=`<path class="curve" d="${fig_mono(fig_fP(FIG_FORGET_F1))}"/>`;
  [[1,100],[2,50],[3,28],[4,23],[5,20]].forEach(([i,v])=>{s+=`<circle class="op" cx="${X(i)}" cy="${Y(v)}" r="3.4"/><text class="vlab" x="${X(i)+5}" y="${Y(v)-6}">${v}</text>`});
  s+=`<text class="note" x="${X(7)+4}" y="${Y(4)}" text-anchor="end">복습하지 않으면 계속 천천히 줄어든다</text></svg>`;
  return s;
};
FIG_TITLES.forget_1 = '<그림 1> 복습을 하지 않았을 때의 파지율';
FIGS.forget_2 = () => {
  const X=fig_fX, Y=fig_fY;
  let s=fig_open(370,250,'복습을 네 번 했을 때 파지율 그래프. 1시간, 1일, 1주, 1달에 복습하면 값이 각각 50, 70, 80, 90에서 100으로 뛰어오른다.',-18)+fig_forget_frame();

/* =====================================================================

// 탈출 속도 v(r) = c·√(r_s/r). r_s 는 가로폭의 12 % (원본은 5~6 % 이나 폰에서 O 와 겹쳐 이동), c 는 세로 높이의 60 %.
FIGS.rel_v = () => {
  const s=fig_scale({xmin:0,xmax:1,ymin:0,ymax:1});
  const rs=0.12, c=0.6, top=(s.y0-(s.y1+6))/(s.y0-s.y1); // top: 그림 위쪽 클립 높이(데이터)
  const v=r=>c*Math.sqrt(rs/r), rmin=rs*(c/top)**2;
  let o=fig_open(370,232,'탈출 속도 v(r)의 그래프. r가 0에 가까워질수록 v는 한없이 커지고, r가 커질수록 완만히 줄어든다. r=r_s에서 v=c이다.');
  o+=fig_axes(s,{arrows:true,origin:'O'});
  // 점근선·보조선: v=c (세로축→오른쪽 끝), r=r_s (가로축→곡선)
  o+=`<line class="faint" x1="${s.x0}" x2="${s.x1}" y1="${fig_r1(s.Y(c))}" y2="${fig_r1(s.Y(c))}"/>`;
  o+=`<line class="faint" x1="${fig_r1(s.X(rs))}" x2="${fig_r1(s.X(rs))}" y1="${s.y0}" y2="${fig_r1(s.Y(c))}"/>`;
  o+=`<path class="curve" d="${fig_fnpath(s,v,rmin,1,80)}"/>`;
  o+=`<text class="tick" x="${s.x0-6}" y="${fig_r1(s.Y(c)+4)}" text-anchor="end" style="fill:var(--ink)">${fig_var('c')}</text>`;
  o+=`<text class="tick" x="${fig_r1(s.X(rs))}" y="${s.y0+14}" text-anchor="middle" style="fill:var(--ink)">${fig_var('r','s')}</text>`;
  o+=`<text class="tick" x="${s.x1+10}" y="${s.y0+14}" text-anchor="middle" style="fill:var(--ink)">${fig_var('r')}</text>`;
  o+=`<text class="tick" x="${s.x0-8}" y="${s.y1-6}" text-anchor="end" style="fill:var(--ink)">${fig_var('v')}</text>`;
  return o+'</svg>';
};
FIG_TITLES.rel_v = '탈출 속도 v(r)';

// 그곳에서 흐르는 시간 t(r) = t_0/√(1 − r_s/r) (r > r_s). r_s 는 가로폭의 22 %, t_0 는 세로 높이의 30 %.
// [불확실] 원본 곡선은 식보다 왼쪽이 더 가파르고 오른쪽 끝이 ≈1.25 t_0 — 여기서는 식 그대로(개형) 그린다.
FIGS.rel_t = () => {
  const s=fig_scale({xmin:0,xmax:1,ymin:0,ymax:1});
  const rs=0.22, t0=0.30, top=(s.y0-(s.y1+4))/(s.y0-s.y1);
  const t=r=>t0/Math.sqrt(1-rs/r), rmin=rs/(1-(t0/top)**2);
  let o=fig_open(370,232,'시간 t(r)의 그래프. r가 r_s에 오른쪽에서 가까워질수록 t는 한없이 커지고, r가 커질수록 t_0에 가까워진다.');
  o+=fig_axes(s,{arrows:true,origin:'O'});
  o+=`<line class="faint" x1="${fig_r1(s.X(rs))}" x2="${fig_r1(s.X(rs))}" y1="${s.y0}" y2="${s.y1-4}"/>`;
  o+=`<line class="faint" x1="${s.x0}" x2="${s.x1}" y1="${fig_r1(s.Y(t0))}" y2="${fig_r1(s.Y(t0))}"/>`;
  o+=`<path class="curve" d="${fig_fnpath(s,t,rmin,1,90)}"/>`;
  o+=`<text class="tick" x="${s.x0-6}" y="${fig_r1(s.Y(t0)+4)}" text-anchor="end" style="fill:var(--ink)">${fig_var('t','0')}</text>`;
  o+=`<text class="tick" x="${fig_r1(s.X(rs))}" y="${s.y0+14}" text-anchor="middle" style="fill:var(--ink)">${fig_var('r','s')}</text>`;
  o+=`<text class="tick" x="${s.x1+10}" y="${s.y0+14}" text-anchor="middle" style="fill:var(--ink)">${fig_var('r')}</text>`;
  o+=`<text class="tick" x="${s.x0-8}" y="${s.y1-6}" text-anchor="end" style="fill:var(--ink)">${fig_var('t')}</text>`;
  return o+'</svg>';
};
FIG_TITLES.rel_t = '그곳에서 흐르는 시간 t(r)';

/* =====================================================================
 * 03 심전도 — 하나의 헬퍼 fig_ecg({pWave, qrs, legend, labels})
 *  pWave: +1 (위로 볼록, 기본) / −1 (A(t): 기저선 아래로 볼록, 강조색)
 *  qrs: 'narrow' (5~7, 기본) / 'wide' (B(t): 4~8)
 *  t 0~14, y −2.5~4.5 (원본 세로 범위 ≈ −2.5~4.5 [불확실, 격자 수로 추정]), 격자 0.5
 * ===================================================================== */
function fig_ecg({pWave=1, qrs='narrow', legend=false, xlabels=[2,4,5,5.5,6,6.5,7,8,12,14], gridStep=0.5, hGrid=true, label=''}={}){
  const W=560, H=legend?312:280;
  const s=fig_scale({x0:40,x1:540,y0:250,y1:40,xmin:0,xmax:14,ymin:-2.5,ymax:4.5});
  const pw = t => pWave*(-(t-2)*(t-4));
  const tw = t => -0.25*(t-8)*(t-12);
  const qrsPts = qrs==='wide' ? [[4,0],[5,-1],[6,4],[7,-2],[8,0]] : [[4,0],[5,0],[5.5,-1],[6,4],[6.5,-2],[7,0],[8,0]];
  const qrsLine = qrs==='wide' ? [[4,0],[5,-1],[6,4],[7,-2],[8,0]] : [[4,0],[5,0],[5.5,-1],[6,4],[6.5,-2],[7,0],[8,0]];
  let o=fig_open(W,H,label);
  // 격자
  for(let v=0;v<=14.001;v+=gridStep) o+=`<line class="gl" x1="${fig_r1(s.X(v))}" x2="${fig_r1(s.X(v))}" y1="${s.y1}" y2="${s.y0}"/>`;
  if(hGrid) for(let v=-2.5;v<=4.501;v+=gridStep) o+=`<line class="gl" x1="${s.x0}" x2="${s.x1}" y1="${fig_r1(s.Y(v))}" y2="${fig_r1(s.Y(v))}"/>`;
  // 기저선(y=0) 안내선 — 격자보다 조금 진하게
  o+=`<line x1="${s.x0}" x2="${s.x1}" y1="${fig_r1(s.Y(0))}" y2="${fig_r1(s.Y(0))}" stroke="var(--muted)" stroke-width=".8" opacity=".55"/>`;
  o+=`<text class="tick" x="${s.x0+3}" y="${fig_r1(s.Y(0)-5)}">기저선</text>`;
  // 가로 눈금 라벨 (5.5, 6.5 는 둘째 줄로 내려 겹침 방지)
  xlabels.forEach(v=>{const second=(v%1)!==0; o+=`<text class="tick" x="${fig_r1(s.X(v))}" y="${s.y0+(second?24:13)}" text-anchor="middle">${v}</text>`;
    if(second) o+=`<line class="gl" x1="${fig_r1(s.X(v))}" x2="${fig_r1(s.X(v))}" y1="${s.y0+2}" y2="${s.y0+15}" stroke="var(--muted)" opacity=".5"/>`;});
  // 조각들: 직선(--ink), 포물선(--accent / A(t)의 P파는 --faint)
  const ink='stroke:var(--ink);stroke-width:2.2';
  o+=`<path class="curve" style="${ink}" d="${fig_poly(s,[[0,0],[2,0]])}"/>`;
  o+=`<path class="curve" style="${pWave<0?'stroke:var(--faint)':''}" d="${fig_fnpath(s,pw,2,4,24)}"/>`;
  o+=`<path class="curve" style="${ink};stroke-linejoin:round" d="${fig_poly(s,qrsLine)}"/>`;
  o+=`<path class="curve" d="${fig_fnpath(s,tw,8,12,24)}"/>`;
  o+=`<path class="curve" style="${ink}" d="${fig_poly(s,[[12,0],[14,0]])}"/>`;
  // 파형 이름
  const lab=(x,y,txt,anchor='middle',fill='var(--ink)')=>`<text class="flab" x="${fig_r1(s.X(x))}" y="${fig_r1(s.Y(y))}" text-anchor="${anchor}" style="fill:${fill}">${txt}</text>`;
  o+= pWave>0 ? lab(3,1.35,'P파','middle','var(--accent)') : lab(3,-1.5,'P파','middle','var(--faint)');
  if(qrs==='wide'){ o+=lab(6,4.3,'QRS파'); }
  else { o+=lab(6,4.3,'R파'); o+=lab(5.1,-1.75,'Q파'); o+=lab(7.35,-2.0,'S파'); }
  o+=lab(10,1.35,'T파','middle','var(--accent)');
  if(legend){
    const ly=H-9;
    o+=`<line x1="64" x2="92" y1="${ly-4}" y2="${ly-4}" class="curve"/><text class="tick" x="100" y="${ly}">P파·T파: 이차함수</text>`;
    o+=`<line x1="296" x2="324" y1="${ly-4}" y2="${ly-4}" class="curve" style="${ink}"/><text class="tick" x="332" y="${ly}">QRS파·기저선: 직선</text>`;
  }
  return o+'</svg>';
}

 <p data-ref="p3">이러한 바탕 위에서 시간은 어디서나 똑같이 흐르는 절대적인 것이 아니라 <b>중력의 세기에 따라 달라지는 것</b>으로 파악된다. 실제로 <mark><b>중력이 센 곳에서는 시간이 느리게 흐르며</b></mark>, 위성 위치 확인 시스템(GPS)의 인공위성은 지표면보다 중력이 약한 곳에 있어 시간이 조금 빠르게 흐르므로 그 차이를 보정해 주어야 한다.</p>

             [String.raw`\(0\)`]: String.raw`곡선이 0에 가까워지는 쪽은 \(r\)가 한없이 커질 때이다. \(r\)가 0에 가까워질 때 세로축 쪽 곡선을 다시 보자.`,
             [String.raw`\(t_0\)`]: String.raw`\(t_0\)은 시간 \(t(r)\)의 식에 나오는 값이다. 지금 보는 함수는 탈출 속도 \(v(r)\)이다.`}}],
      hints:[{ref:'f1', t: String.raw`그래프에서 \(r\)가 0에 가까워질수록(세로축 쪽으로 갈수록) 파란 곡선은 위로 올라가는가, 아래로 내려가는가? 멈추는 높이가 있는가?`},
             {t: String.raw`거리 \(r\)는 음수가 될 수 없다. 그렇다면 0에 다가갈 때 어느 쪽에서만 다가갈 수 있는지 정해 \(\lim\) 아래의 방향 표시를 고르자. 값 쪽은 곡선이 멈추는 높이가 있는지로 판단한다.`}],
      model: String.raw`\(\displaystyle\lim_{r\to 0^+} v(r)=\infty\)` },
    { id:'a1p2', no:'(2)', q: String.raw`그 결과가 <b>블랙홀이 생기는 까닭</b>과 어떻게 연결되는지 <b>2문장 이내</b>로 쓸 것. (‘탈출 속도’와 ‘빛의 속도’를 반드시 사용)`,
      type:'none',
      write:{ lines:2, checklist:[String.raw`‘탈출 속도’라는 말을 썼다`, String.raw`‘빛의 속도’라는 말을 썼다`, String.raw`\(r\)가 작아질수록 탈출 속도가 한없이 커진다는 (1)의 결과를 근거로 썼다`, String.raw`탈출 속도가 빛의 속도에 이르면 빛조차 빠져나올 수 없게 되어 블랙홀이 된다고 연결했다`] },
      hints:[{ref:'p4', t: String.raw`읽기자료 넷째 문단을 보자. 탈출 속도가 무엇에 이르면 블랙홀이 된다고 했는가?`},
             {t: String.raw`첫 문장은 (1)의 결과(\(r\)가 작아질수록 탈출 속도가 한없이 커진다)로, 둘째 문장은 ‘그러다 빛의 속도 \(c\)에 이르면 …’으로 이어 보자.`}],
      model: String.raw`천체의 크기가 작아져 \(r\)가 작아질수록 탈출 속도가 한없이 커진다. 그러다 탈출 속도가 빛의 속도 \(c\)에 이르면 빛조차 빠져나올 수 없게 되어 블랙홀이 된다.` }
  ]},
  { id:'a2', area:'Ⅰ', title: String.raw`활동 2`,
    lead: String.raw`앞으로 다룰 두 식을 해석하려면 <b>어떤 수학 개념이 필요한지</b> 스스로 판단해 보자.`,
    parts:[
    { id:'a2p1', no:'(1)', q: String.raw`식 \(t(r)=\dfrac{t_0}{\sqrt{1-\dfrac{r_s}{r}}}\)에서 \(r\)가 \(r_s\)에 <b>가까워질 때</b> 시간이 어떻게 되는지 설명하려 한다. ‘<b>극한</b>’과 ‘<b>연속</b>’ 중 어떤 개념이 필요한가? 하나를 고르고, 그렇게 고른 까닭을 <b>식의 특징(분모의 모양)과 연결하여</b> 1문장으로 쓸 것.`,
      type:'choices',
      groups:[{k:'c', label: String.raw`필요한 개념`, opts:['극한','연속'], ans:['극한'], multi:false,
               fb:{'연속': String.raw`식에 끊어진 곳이 있는지를 묻는 것이 아니라, \(r\)가 \(r_s\)에 ‘가까워질 때’ 값이 어떻게 변하는지를 묻고 있다. 그 변화를 말하는 개념은 무엇일까?`}}],
      write:{ lines:1, checklist:[String.raw`분모의 \(1-\dfrac{r_s}{r}\)가 0에 가까워진다는 식의 특징을 근거로 들었다`, String.raw`그래서 값이 한없이 커지므로 그 변화를 말하려면 극한이 필요하다고 연결했다`, String.raw`‘배웠으니까’, ‘그게 맞아서’처럼 식과 관계없는 이유가 아니다`] },
      hints:[{ref:'f1', t: String.raw`분모 \(\sqrt{1-\dfrac{r_s}{r}}\)에서 \(r\)가 \(r_s\)에 가까워지면 \(\dfrac{r_s}{r}\)는 어떤 값에 가까워지는가? 그러면 분모는?`},
             {t: String.raw`분모가 0에 가까워지면 분수의 값은 한없이 커진다. ‘값이 어떤 값에 한없이 가까워지는가(또는 한없이 커지는가)’를 다루는 개념을 고르고, ‘분모가 … 에 가까워져 …’로 까닭을 써 보자.`}],
      model: String.raw`극한. \(r\)가 \(r_s\)에 가까워질수록 분모의 \(1-\dfrac{r_s}{r}\)가 0에 가까워져 값이 한없이 커지므로, 그 변화를 말하려면 극한이 필요하다.` },
    { id:'a2p2', no:'(2)', q: String.raw`같은 식에서 \(r=r_s\)일 때의 값을 <b>직접 구할 수 있는가?</b> 판단하고, 그 까닭을 식의 어느 부분 때문인지 들어 1문장으로 쓸 것.`,
      type:'choices',
      groups:[{k:'j', label: String.raw`판단`, opts:['구할 수 있다','구할 수 없다'], ans:['구할 수 없다'], multi:false,
               fb:{'구할 수 있다': String.raw`\(r=r_s\)를 식에 직접 넣어 보자. 분모의 \(1-\dfrac{r_s}{r_s}\)는 얼마가 되는가? 그 수로 나눌 수 있는가?`}}],
      write:{ lines:1, checklist:[String.raw`\(r=r_s\)이면 분모가 0이 된다는 점을 들었다`, String.raw`그래서 식이 정의되지 않는다(값이 없다)고 썼다`, {t: String.raw`“무한대이기 때문”이라고 쓰지 않았다 (값이 없는 것과 무한대인 것은 다르다)`, warn:true}] },
      hints:[{ref:'f1', t: String.raw`\(r=r_s\)를 넣으면 \(\dfrac{r_s}{r}=1\)이다. 그러면 분모 \(\sqrt{1-1}\)은 얼마인가?`},
             {t: String.raw`0으로 나누는 것은 정의되지 않는다. ‘극한값이 \(\infty\)’인 것과 ‘그 점의 값이 없다’는 것은 다른 말이니, 까닭을 ‘분모가 … 이 되어 …’로 써 보자.`}],
      model: String.raw`구할 수 없다. \(r=r_s\)이면 분모가 0이 되어 식이 정의되지 않기 때문이다.` }
  ]},
  { id:'a3', area:'Ⅱ', title: String.raw`활동 3`,
    lead: String.raw`오른쪽 그림은 함수 \(t(r)=\dfrac{t_0}{\sqrt{1-\dfrac{r_s}{r}}}\)의 그래프이다. 극한 \(\displaystyle\lim_{r\to r_s^+} t(r)\)를 조사하고, 위의 내용을 바탕으로 그 의미를 설명해 보자.`,
    parts:[
    { id:'a3p1', no:'(1)', q: String.raw`극한을 <b>극한 기호를 사용하여</b> 쓸 것.`, fig:'rel_t',
      type:'choices',
      groups:[
        {k:'dir', label: String.raw`극한의 방향 (\(\lim\) 아래에 쓸 것)`,
         opts:[String.raw`\(r\to r_s^+\)`, String.raw`\(r\to r_s^-\)`, String.raw`\(r\to r_s\)`, String.raw`\(r\to 0^+\)`, String.raw`\(r\to\infty\)`],
         ans:[String.raw`\(r\to r_s^+\)`], multi:false,
         fb:{[String.raw`\(r\to r_s\)`]: String.raw`식은 \(r>r_s\)에서만 주어졌으므로 \(r_s\)보다 큰 쪽에서만 다가갈 수 있다. 어느 쪽 극한인지 방향을 밝히지 않으면 감점된다. 어떻게 써야 할까?`,
             [String.raw`\(r\to r_s^-\)`]: String.raw`그래프에서 \(r\lt r_s\)인 곳에 곡선이 있는가? 식이 주어진 범위 \((r>r_s)\)를 다시 보자.`,
             [String.raw`\(r\to 0^+\)`]: String.raw`머리글에서 조사하라고 한 극한은 \(r\)가 어디에 다가갈 때인가? 붉은 세로 점선의 위치를 보자.`,
             [String.raw`\(r\to\infty\)`]: String.raw`\(r\)가 한없이 커질 때는 활동 4에서 다룬다. 지금은 \(r\)가 경계 \(r_s\)에 다가갈 때이다.`}},
        {k:'val', label: String.raw`극한값 (\(t(r)\) 이 다가가는 값)`,
         opts:[String.raw`\(\infty\)`, String.raw`\(c\)`, String.raw`\(t_0\)`, String.raw`\(0\)`],
         ans:[String.raw`\(\infty\)`], multi:false,
         fb:{[String.raw`\(t_0\)`]: String.raw`\(t_0\)은 곡선이 오른쪽으로 멀어질 때 다가가는 높이(수평 점선)이다. 세로 점선 \(r=r_s\) 바로 오른쪽에서 곡선은 어디로 가는가?`,
             [String.raw`\(0\)`]: String.raw`곡선이 가로축에 닿는 곳이 있는가? \(r_s\) 근처에서 곡선은 위로 치솟는다.`,
             [String.raw`\(c\)`]: String.raw`\(c\)는 빛의 속도로, 활동 1의 \(v(r)\) 그래프에 있던 값이다. 지금 보는 함수는 시간 \(t(r)\)이다.`}}],
      hints:[{ref:'f1', t: String.raw`그래프에서 \(r\)가 붉은 세로 점선 \(r=r_s\)에 오른쪽에서 다가갈수록 파란 곡선은 어디로 가는가? 멈추는 높이가 있는가?`},
             {t: String.raw`식이 \(r\gt r_s\)에서만 주어졌다. 이 사실이 ‘어느 쪽에서 다가갈 수 있는가’를 정해 주므로, 그것을 \(\lim\) 아래의 방향 표시에 반영하자. 값 쪽은 곡선이 멈추는 높이가 있는지로 판단한다.`}],
      model: String.raw`\(\displaystyle\lim_{r\to r_s^+} t(r)=\infty\)` },
    { id:'a3p2', no:'(2)', q: String.raw`\(r\)가 \(r_s\)에 가까워질 때 <b>중력</b>이 어떻게 되는지를 먼저 밝히고, 그로부터 시간의 흐름이 어떻게 되는지 <b>2문장 이내</b>로 설명할 것.`,
      type:'none',
      write:{ lines:2, checklist:[String.raw`\(r\)가 \(r_s\)에 가까워질수록 중력이 한없이 세진다고 먼저 밝혔다`, String.raw`중력이 셀수록 시간이 느리게 흐른다는 읽기자료의 관계를 근거로 썼다`, String.raw`그래서 그곳의 시간이 먼 곳에 비해 한없이 느리게 흐르게 된다고 결론지었다`, {t: String.raw`중력을 말하지 않고 “시간이 느려진다”만 쓰지 않았다 (중력 → 시간의 순서가 필요하다)`, warn:true}] },
      hints:[{ref:'p3', t: String.raw`읽기자료 셋째 문단을 보자. 중력이 센 곳에서 시간은 어떻게 흐른다고 했는가? 그리고 블랙홀 경계 근처의 중력은 어떤가(넷째 문단)?`},
             {t: String.raw`첫 문장은 ‘\(r\)가 \(r_s\)에 가까워질수록 중력이 …’, 둘째 문장은 ‘중력이 셀수록 시간이 … 흐르므로 그곳의 시간은 …’으로 써 보자. (1)의 \(\infty\)와 이어진다.`}],
      model: String.raw`\(r\)가 \(r_s\)에 가까워질수록 중력이 한없이 세진다. 중력이 셀수록 시간이 느리게 흐르므로, 그곳의 시간은 먼 곳에 비해 한없이 느리게 흐르게 된다.` },
    { id:'a3p3', no:'(3)', q: String.raw`이 극한을 두고 “극한값이 존재한다”고 말할 수 있는가? <b>예 / 아니오</b>와 그 까닭을 한 줄로 쓸 것.`,
      type:'choices',
      groups:[{k:'e', label: String.raw`극한값이 존재한다고 말할 수 있는가?`, opts:['예','아니오'], ans:['아니오'], multi:false,
               fb:{'예': String.raw`(1)에서 쓴 \(\infty\)는 실수인가? 극한값이 존재한다는 것은 어떤 실수에 한없이 가까워진다는 뜻이다.`}}],
      write:{ lines:1, checklist:[String.raw`\(\infty\)는 실수가 아니라는 점을 까닭으로 들었다`, String.raw`극한값이 존재한다고 하지 않고 ‘발산한다’고 한다는 표현을 썼다`] },
      hints:[{t: String.raw`극한값이 ‘존재한다’는 말은 어떤 실수에 한없이 가까워진다는 뜻이다. (1)에서 쓴 \(\infty\)는 실수인가?`},
             {t: String.raw`한없이 커지는 경우에는 ‘극한값이 존재한다’ 대신 어떤 말을 쓰는지 떠올려 보자. ‘아니오. \(\infty\)는 … 가 아니므로 …’로 써 보자.`}],
      model: String.raw`아니오. \(\infty\)는 실수가 아니므로 극한값이 존재한다고 하지 않고 발산한다고 한다.` }
  ]},
  { id:'a4', area:'Ⅱ', title: String.raw`활동 4`,
    lead: String.raw`위 활동 3의 그래프에서 극한 \(\displaystyle\lim_{r\to\infty} t(r)\)를 조사하고, 그 의미를 설명해 보자.`,
    parts:[
    { id:'a4p1', no:'(1)', q: String.raw`극한값을 \(t_0\)을 사용하여 쓸 것.`, fig:'rel_t',
      type:'choices',
      groups:[
        {k:'dir', label: String.raw`극한의 방향 (\(\lim\) 아래에 쓸 것)`,
         opts:[String.raw`\(r\to\infty\)`, String.raw`\(r\to r_s^+\)`, String.raw`\(r\to 0^+\)`, String.raw`\(r\to t_0\)`],
         ans:[String.raw`\(r\to\infty\)`], multi:false,
         fb:{[String.raw`\(r\to r_s^+\)`]: String.raw`그것은 활동 3에서 조사한 극한이다. 이번 머리글의 극한 기호 아래에는 무엇이 적혀 있는가?`,
             [String.raw`\(r\to 0^+\)`]: String.raw`\(t(r)\)는 \(r>r_s\)에서만 정의되므로 \(r\)가 0에 다가갈 수 없다. 머리글의 극한 기호를 다시 보자.`,
             [String.raw`\(r\to t_0\)`]: String.raw`\(t_0\)은 \(r\)가 다가가는 곳이 아니라 \(t(r)\)의 값이 다가가는 높이이다. \(r\)는 어디로 가는가?`}},
        {k:'val', label: String.raw`극한값 (\(t(r)\) 이 다가가는 값)`,
         opts:[String.raw`\(t_0\)`, String.raw`\(\infty\)`, String.raw`\(0\)`, String.raw`\(c\)`],
         ans:[String.raw`\(t_0\)`], multi:false,
         fb:{[String.raw`\(\infty\)`]: String.raw`한없이 올라가는 쪽은 \(r_s\) 근처이다. 그래프의 오른쪽 끝에서 곡선은 어떤 높이에 붙어 가는가?`,
             [String.raw`\(0\)`]: String.raw`곡선이 가로축까지 내려오는가? 붉은 수평 점선의 라벨을 읽어 보자.`,
             [String.raw`\(c\)`]: String.raw`\(c\)는 빛의 속도로 \(v(r)\) 그래프의 값이다. \(t(r)\) 그래프의 수평 점선에는 무엇이 적혀 있는가?`}}],
      hints:[{ref:'p6', t: String.raw`그래프에서 \(r\)가 오른쪽으로 한없이 커질 때 파란 곡선은 어떤 높이(붉은 수평 점선)에 가까워지는가? 그 점선의 라벨을 읽자.`},
             {t: String.raw`방향은 \(r\)가 한없이 커지는 쪽이다. 값은 곡선이 가까워지는 붉은 수평 점선의 라벨을 그대로 읽어 쓰면 된다. 읽기자료에서 그 기호가 무엇을 뜻하는지도 확인해 두자.`}],
      model: String.raw`\(\displaystyle\lim_{r\to\infty} t(r)=t_0\)` },
    { id:'a4p2', no:'(2)', q: String.raw`그 값이 무엇을 뜻하는지 <b>‘중력’이라는 말을 반드시 사용하여 2문장 이내</b>로 쓸 것.`,
      type:'none',
      write:{ lines:2, checklist:[String.raw`‘중력’이라는 말을 썼다`, String.raw`천체에서 아주 멀어질수록 중력이 거의 작용하지 않는다는 점을 원인으로 들었다`, String.raw`그래서 시간이 느려지는 효과가 사라지고 먼 곳의 시간 \(t_0\)과 같은 속도로 흐른다고 썼다`, {t: String.raw`거리만 말하고 중력을 쓰지 않은 답이 아니다`, warn:true}] },
      hints:[{ref:'p6', t: String.raw`읽기자료에서 \(t_0\)은 어떤 곳에서 흐르는 시간이라고 했는가? 그곳의 중력은 어떤가?`},
             {t: String.raw`‘천체에서 아주 멀어질수록 중력이 …’로 시작하고, 그래서 시간이 느려지는 효과가 어떻게 되어 \(t_0\)과 어떤 관계가 되는지 이어 보자.`}],
      model: String.raw`천체에서 아주 멀어질수록 중력이 거의 작용하지 않으므로, 시간이 느려지는 효과가 사라지고 먼 곳의 시간 \(t_0\)과 같은 속도로 흐른다.` },
    { id:'a4p3', no:'(3)', q: String.raw`본문에 나온 GPS 인공위성은 지표면과 이 “아주 먼 곳” 중 어느 쪽에 더 가까운 상황인지 고르고, 그 까닭을 한 줄로 쓸 것.`,
      type:'choices',
      groups:[{k:'s', label: String.raw`더 가까운 상황`, opts:['지표면','아주 먼 곳'], ans:['지표면'], multi:false,
               fb:{'아주 먼 곳': String.raw`“아주 먼 곳”은 중력의 영향이 거의 없는 곳이다. 인공위성은 지구 중력에서 완전히 벗어나 있는가? 읽기자료의 GPS 부분을 다시 보자.`}}],
      write:{ lines:1, checklist:[String.raw`인공위성이 지표면보다 조금 높을 뿐 지구 중력의 영향을 여전히 받는다는 점을 들었다`, String.raw`그래서 시간 차이를 보정해 주어야 한다(완전히 먼 곳은 아니다)는 취지로 썼다`] },
      hints:[{ref:'p3', t: String.raw`읽기자료 셋째 문단에서 GPS 인공위성은 지표면보다 중력이 어떻다고 했는가? 중력이 ‘약하다’와 ‘거의 없다’는 같은 말인가?`},
             {t: String.raw`“아주 먼 곳”에서는 보정할 차이 자체가 거의 없다. 인공위성은 시간 차이를 보정해 주어야 한다고 했으니, 어느 쪽에 더 가까운 상황일까?`}],
      model: String.raw`지표면 쪽에 가깝다. 인공위성은 지표면보다 조금 높을 뿐 지구 중력의 영향을 여전히 받으므로, 시간 차이를 보정해 주어야 한다. (“완전히 먼 곳은 아니다”, “여전히 중력을 받는다”는 취지면 모두 인정)` }
  ]},
  { id:'a5', area:'Ⅱ', title: String.raw`활동 5`,
    box: String.raw`<b>계산을 위한 단순화 모델</b><br>위의 식 \(t(r)\)는 제곱근을 포함하고 있어 값을 손으로 다루기 어렵다. 이제 거리를 \(r_s\)의 몇 배인지로 바꾼 값 \(x=\dfrac{r}{r_s}\)를 쓰고, 위 그래프와 <b>같은 성질</b>(경계에 다가가면 한없이 커지고, 멀어지면 일정한 값에 가까워짐)을 갖도록 <b>단순화한 다음 모델</b>로 자세히 살펴보자.\[ D(x)=\dfrac{x}{x-1} \]여기서 \(D(x)\)는 <b>그 지점의 시간이 먼 곳의 시간보다 몇 배 느리게 가는지를 나타내는 값</b>이다. \(x=1\)은 활동 3의 \(r=r_s\)에 해당한다. 이 식이 어떤 \(x\)에서 뜻을 가지는지는 스스로 판단해야 한다.`,
    lead: String.raw`다음 표의 빈칸을 채우고, 활동 3의 그래프와 견주어 보자. <b>(계산 8점 + 서술 4점)</b>`,
    parts:[
    { id:'a5p1', no:'', q: String.raw``,
      type:'grid', head: String.raw`\(x\)`,
      cols:[String.raw`\(5\)`, String.raw`\(2\)`, String.raw`\(\dfrac{5}{4}\)`, String.raw`\(\dfrac{11}{10}\)`, String.raw`\(\dfrac{101}{100}\)`],
      rows:[{label: String.raw`\(x-1\)`, ans:[4,1,'1/4','1/10','1/100'], tol:0.001},
            {label: String.raw`\(D(x)\)`, ans:['5/4',2,5,11,101], tol:0.001}],
      hints:[{t: String.raw`\(D(x)=\dfrac{x}{x-1}\)이므로 먼저 둘째 줄의 \(x-1\)을 구한 뒤, \(x\)를 그 값으로 나누면 \(D(x)\)이다. 분수는 5/4 처럼, 소수는 1.25 처럼 써도 된다.`},
             {t: String.raw`\(x=\dfrac54\)이면 \(x-1=\dfrac14\), \(D(x)=\dfrac{5/4}{1/4}=5\)이다. 나머지 칸도 같은 방법으로 채워 보자. \(x-1\)이 작아질수록 \(D(x)\)는 어떻게 되는가?`}],
      model: String.raw`\(x-1\): 4, 1, \(\dfrac14\), \(\dfrac1{10}\), \(\dfrac1{100}\) / \(D(x)\): \(\dfrac54\), 2, 5, 11, 101 (소수 표기 1.25, 0.25, 0.1, 0.01도 정답)` },
    { id:'a5p2', no:'', q: String.raw`표에서 읽히는 경향을 “\(x\)가 ____에 가까워질수록 ____” 형태의 <b>1문장</b>으로 쓰시오.`,
      type:'none',
      write:{ lines:1, checklist:[String.raw`\(x\)가 1에 가까워질수록 … 이라고 썼다`, String.raw`\(D(x)\)의 값이 급격히 커진다(한없이 커진다)고 썼다`, String.raw`활동 3의 그래프가 \(r_s\) 근처에서 치솟는 모습과 같다는 점을 견주었다`] },
      hints:[{t: String.raw`표에서 \(x\)의 값은 5, 2, \(\tfrac54\), \(\tfrac{11}{10}\), \(\tfrac{101}{100}\)으로 어떤 수에 다가가고 있는가? 그때 \(D(x)\)는 어떻게 변하는가?`},
             {t: String.raw`\(x\)가 1에 가까워질 때 \(D(x)\)는 5, 11, 101로 급격히 커진다. 이것은 활동 3 그래프의 어느 부분과 닮았는가?`}],
      model: String.raw`\(x\)가 1에 가까워질수록 \(D(x)\)의 값이 급격히 커진다. (활동 3 그래프가 \(r_s\) 근처에서 치솟는 모습과 같다.)` }
  ]},
  { id:'a6', area:'Ⅱ', title: String.raw`활동 6`,
    lead: String.raw`활동 3의 식은 \(r>r_s\)에서만 주어졌다. 단순화 모델에서도 \(x<1\)을 쓸 수 없음을 다음 순서로 밝혀 보자.`,
    parts:[
    { id:'a6p1', no:'(1)', q: String.raw`\(x=\dfrac12\)일 때 \(D(x)\)의 값을 구할 것.`,
      type:'fields',
      fields:[{k:'v', label: String.raw`\(D\!\left(\dfrac12\right)=\)`, ans:-1, tol:0,
               wrong:{'1': String.raw`분모 \(\dfrac12-1\)의 부호를 다시 보자. \(\dfrac12\)에서 1을 빼면 양수인가, 음수인가?`,
                      '-2': String.raw`\(\dfrac{1/2}{-1/2}\)을 계산해 보자. 분자와 분모의 크기가 같으면 몫은 얼마인가?`,
                      '2': String.raw`\(x-1\)을 \(1-x\)로 계산하지 않았는가? \(D(x)=\dfrac{x}{x-1}\)의 분모는 \(x-1\)이다.`}}],
      write:{ lines:1, checklist:[String.raw`분자 \(\dfrac12\), 분모 \(\dfrac12-1=-\dfrac12\)을 식으로 썼다`, String.raw`\(\dfrac{1/2}{-1/2}=-1\)로 나눗셈 과정을 보였다`] },
      hints:[{t: String.raw`\(D(x)=\dfrac{x}{x-1}\)에 \(x=\dfrac12\)을 넣으면 분모는 \(\dfrac12-1\)이다. 이 값의 부호에 주의하자.`},
             {t: String.raw`\(\dfrac12-1=-\dfrac12\)이므로 \(D\!\left(\dfrac12\right)=\dfrac{1/2}{-1/2}\)이다. 크기가 같은 두 수를 나누면 몫의 절댓값은 1이고, 부호는?`}],
      model: String.raw`\(D\!\left(\dfrac12\right)=\dfrac{1/2}{1/2-1}=\dfrac{1/2}{-1/2}=-1\)` },
    { id:'a6p2', no:'(2)', q: String.raw`그 값이 \(D(x)\)의 뜻에 비추어 왜 받아들일 수 없는지 <b>1문장</b>으로 쓸 것.`,
      type:'none',
      write:{ lines:1, checklist:[String.raw`\(D(x)\)는 시간이 몇 배 느리게 가는지를 나타내는 값이므로 1 이상이어야 한다는 뜻을 들었다`, String.raw`−1은 음수여서 그렇게 해석할 수 없다는 수학적 근거를 썼다`, {t: String.raw`“블랙홀 안에는 못 들어가니까”처럼 물리 상식만으로 답하지 않았다 (계산값이 음수라는 근거가 필요하다)`, warn:true}] },
      hints:[{t: String.raw`단순화 모델 상자에서 \(D(x)\)는 무엇을 나타내는 값이라고 했는가? ‘몇 배 느리게’라는 값이 음수일 수 있을까?`},
             {t: String.raw`‘느려지는 배수’는 적어도 1 이상이어야 한다. (1)에서 구한 −1이 그 뜻에 맞지 않는 까닭을 ‘음수’라는 말로 써 보자.`}],
      model: String.raw`\(D(x)\)는 시간이 몇 배 느리게 가는지를 나타내는 값이므로 1 이상이어야 하는데, −1은 음수여서 그렇게 해석할 수 없다.` },
    { id:'a6p3', no:'(3)', q: String.raw`따라서 \(x\to 1\)로 다가갈 때 좌극한과 우극한 중 <b>무엇만 따져야 하는지</b> 쓰고, 그것이 활동 3의 \(\displaystyle\lim_{r\to r_s^+}\)와 어떻게 대응하는지 한 줄로 쓸 것.`,
      type:'choices',
      groups:[{k:'d', label: String.raw`따져야 하는 극한`, opts:['좌극한','우극한','둘 다'], ans:['우극한'], multi:false,
               fb:{'좌극한': String.raw`좌극한은 \(x\)가 1보다 작은 쪽에서 다가갈 때이다. (2)에서 \(x<1\)은 쓸 수 없다고 밝혔는데, 그 쪽에서 다가갈 수 있을까?`,
                   '둘 다': String.raw`\(x<1\)은 뜻을 가지지 않는 영역이다. 뜻이 없는 쪽에서 다가가는 극한도 따져야 할까?`}}],
      write:{ lines:1, checklist:[String.raw`\(x>1\)(\(r>r_s\)) 쪽에서만 다가갈 수 있으므로 우극한만 따진다고 썼다`, String.raw`활동 3에서 \(\displaystyle\lim_{r\to r_s^+}\)에 ‘+’를 붙인 것과 같은 상황이라고 대응시켰다`] },
      hints:[{t: String.raw`(2)에서 \(x<1\)은 쓸 수 없다고 했다. 그러면 \(x\)는 1보다 큰 쪽과 작은 쪽 중 어느 쪽에서만 1에 다가갈 수 있는가?`},
             {t: String.raw`활동 3에서 \(\lim\) 아래에 \(r\to r_s^+\)라고 ‘+’를 붙인 까닭을 떠올리자. \(x=\dfrac{r}{r_s}\)이므로 \(x\to 1^+\)는 \(r\to r_s^+\)와 같은 상황이다.`}],
      model: String.raw`우극한만 따진다. 이는 활동 3에서 \(r\)가 \(r_s\)보다 큰 쪽에서만 다가갈 수 있어 \(\displaystyle\lim_{r\to r_s^+}\)를 쓴 것과 같은 상황이다.` }
  ]},
  { id:'a7', area:'Ⅲ', title: String.raw`활동 7`,
    parts:[
    { id:'a7p1', no:'(1)', q: String.raw`함수 \(D(x)\)가 \(x=1\)에서 <b>연속인지 판단</b>하고, 한 점에서 연속이기 위한 조건 중 <b>어떤 조건이 성립하지 않는지</b>를 \(D(x)\)의 식을 이용하여 밝힐 것.`,
      type:'choices',
      groups:[
        {k:'c', label: String.raw`\(D(x)\)는 \(x=1\)에서`, opts:['연속이다','연속이 아니다'], ans:['연속이 아니다'], multi:false,
         fb:{'연속이다': String.raw`\(x=1\)을 \(D(x)=\dfrac{x}{x-1}\)에 넣어 보자. 함숫값 \(D(1)\)이 있는가?`}},
        {k:'w', label: String.raw`성립하지 않는 조건`, opts:[String.raw`ⓐ \(f(a)\)가 정의된다`, String.raw`ⓑ \(\displaystyle\lim_{x\to a}f(x)\)가 존재한다`, String.raw`ⓒ 두 값이 같다`], ans:[String.raw`ⓐ \(f(a)\)가 정의된다`], multi:false,
         fb:{[String.raw`ⓑ \(\displaystyle\lim_{x\to a}f(x)\)가 존재한다`]: String.raw`극한을 따지기 전에 \(D(1)\) 자체가 있는가? 분모에 \(x=1\)을 넣어 보자. 가장 먼저 깨지는 조건은 무엇일까?`,
             [String.raw`ⓒ 두 값이 같다`]: String.raw`두 값을 비교하려면 함숫값과 극한값이 먼저 있어야 한다. \(D(1)\)은 정의되는가?`}}],
      write:{ lines:1, checklist:[String.raw`연속의 조건(ⓐ 함숫값이 정의됨 ⓑ 극한값이 존재함 ⓒ 두 값이 같음)을 밝혔다`, String.raw`\(x=1\)에서 분모가 \(1-1=0\)이 된다는 것을 식으로 보였다`, String.raw`그래서 \(D(1)\)이 정의되지 않아 ⓐ부터 성립하지 않는다고 결론지었다`] },
      hints:[{t: String.raw`함수가 \(x=a\)에서 연속이려면 ⓐ \(f(a)\)가 정의되고 ⓑ \(\displaystyle\lim_{x\to a}f(x)\)가 존재하며 ⓒ 두 값이 같아야 한다. \(D(1)\)은 정의되는가?`},
             {t: String.raw`\(D(x)=\dfrac{x}{x-1}\)의 분모에 \(x=1\)을 넣으면 \(1-1=0\)이다. 이 식을 답안에 쓰고, 그래서 어느 조건부터 성립하지 않는지 밝히자.`}],
      model: String.raw`연속이 아니다. 함수 \(f\)가 \(x=a\)에서 연속이려면 ⓐ \(f(a)\)가 정의되고 ⓑ \(\displaystyle\lim_{x\to a}f(x)\)가 존재하며 ⓒ 두 값이 같아야 한다. 그런데 \(x=1\)에서는 분모가 \(1-1=0\)이 되어 \(D(1)\)이 정의되지 않으므로 ⓐ부터 성립하지 않는다.` },
    { id:'a7p2', no:'(2)', q: String.raw`이 결론이 “우리는 블랙홀 경계 <b>바로 그 지점</b>의 값을 어떻게 다룰 수밖에 없는가”와 어떻게 연결되는지 <b>2문장 이내</b>로 쓸 것.`,
      type:'none',
      write:{ lines:2, checklist:[String.raw`경계에서의 값은 식에 직접 대입해 구할 수 없다고 썼다`, String.raw`그 지점에 한없이 가까이 다가갈 때의 경향(극한)으로만 말할 수 있다고 썼다`, String.raw`(1)의 결론(\(D(1)\)이 정의되지 않음)과 연결했다`] },
      hints:[{t: String.raw`(1)에서 \(D(1)\)은 정의되지 않았다. 그렇다면 경계 ‘바로 그 지점’의 값을 식에 넣어 구할 수 있는가?`},
             {t: String.raw`대입할 수 없다면 남는 방법은 활동 3·5처럼 그 지점에 ‘다가갈 때’의 경향을 보는 것이다. ‘대입 불가’와 ‘극한으로만’ 두 가지를 담아 써 보자.`}],
      model: String.raw`경계에서의 값은 식에 직접 대입해 구할 수 없고, 그 지점에 한없이 가까이 다가갈 때의 경향으로만 말할 수 있다.` }
  ]},
  { id:'a8', area:'Ⅲ', title: String.raw`활동 8`,
    lead: String.raw`어느 관측소가 담당 구간이 다른 두 장비의 자료를 정리하여, 시간이 느려지는 정도를 다음 함수 \(g(x)\)로 나타내었다.\[ g(x)=\begin{cases} x^2-2x+c & (1\lt x\lt 3)\\ 4x-7 & (x\ge 3)\end{cases} \]`,
    parts:[
    { id:'a8p1', no:'', q: String.raw`두 장비의 자료가 \(x=3\)에서 <b>끊기지 않고 이어지도록</b> 상수 \(c\)의 값을 정하시오. 좌극한, 우극한, 함숫값을 각각 <b>식으로 쓰고 비교하는 과정</b>을 반드시 포함할 것.`,
      type:'fields',
      fields:[{k:'c', label: String.raw`\(c=\)`, ans:2, tol:0,
               wrong:{'-2': String.raw`\(3+c=5\)에서 \(c\)를 구할 때 부호를 다시 보자.`,
                      '5': String.raw`5는 우극한(함숫값)이다. 좌극한 \(3+c\)가 이 값과 같아지려면 \(c\)는 얼마인가?`,
                      '4': String.raw`좌극한을 \(3^2-2\cdot3+c\)로 계산했는가? \(9-6\)은 얼마인가?`,
                      '0': String.raw`좌극한 \(3^2-2\cdot3+c=3+c\)와 우극한 \(4\cdot3-7=5\)가 같아야 한다. \(c=0\)이면 두 값이 같은가?`}}],
      write:{ lines:3, checklist:[String.raw`좌극한을 식으로 썼다: \(\displaystyle\lim_{x\to 3^-} g(x)=3^2-2\cdot3+c=3+c\)`, String.raw`우극한과 함숫값을 식으로 썼다: \(\displaystyle\lim_{x\to 3^+} g(x)=g(3)=4\cdot3-7=5\)`, String.raw`연속이려면 (좌극한)=(우극한)=(함숫값)이어야 하므로 \(3+c=5\)라는 등식을 세웠다`, {t: String.raw`과정 없이 \(c=2\)만 쓰지 않았다`, warn:true}] },
      hints:[{t: String.raw`\(x=3\)에서 이어지려면 좌극한, 우극한, 함숫값이 모두 같아야 한다. \(x<3\) 쪽 식과 \(x\ge 3\) 쪽 식에 각각 \(x=3\)을 넣어 보자.`},
             {t: String.raw`좌극한은 \(x^2-2x+c\)에 3을 넣은 \(3+c\), 우극한과 함숫값은 \(4x-7\)에 3을 넣은 5이다. 두 값이 같다는 등식을 세워 \(c\)를 구하자.`}],
      model: String.raw`\(\displaystyle\lim_{x\to 3^-} g(x)=3^2-2\cdot3+c=3+c\), \(\displaystyle\lim_{x\to 3^+} g(x)=g(3)=4\cdot3-7=5\). 연속이려면 \(3+c=5\)이므로 \(c=2\).` }
  ]},
  { id:'a9', area:'Ⅲ', title: String.raw`활동 9`,
    lead: String.raw`어느 과학 잡지가 다음과 같은 문장을 실었다.`,
    quote: String.raw`“수학은 블랙홀의 경계에서 시간이 완전히 멈춘다고 말한다.”`,

      hints:[{ref:'p4', t: String.raw`(1)에서 구한 두 값을 빼 보자. 그리고 두 사람의 소득(과세 표준)은 얼마나 차이 나는지 생각해 보자.`},
             {t: String.raw`소득은 1만 원 차이인데 세금은 450만 원 넘게 차이 난다. 그러면 5001만 원인 사람의 ‘세금을 낸 뒤 남는 돈’은 5000만 원인 사람보다 많을까, 적을까?`}],
      model: String.raw`차: \(1200.24-750=450.24\)(만 원). 소득은 1만 원밖에 차이 나지 않는데 세금은 450만 원 넘게 차이 나므로, 경계를 조금 넘은 사람이 오히려 손에 쥐는 돈이 적어져 불합리하다.` }
  ]},
  { id:'a2', area:'Ⅰ', title: String.raw`활동 2`,
    lead: String.raw`이 문제를 해결하려면 <b>어떤 수학 개념이 필요한지</b> 스스로 판단해 보자.`,
    parts:[
    { id:'a2p1', no:'(1)', q: String.raw`활동 1에서 보았듯 누진 공제가 없으면 경계에서 세금이 갑자기 된다. 누진 공제액을 <b>이런 일이 없도록 정하려면</b> ‘<b>극한</b>’과 ‘<b>연속</b>’ 중 어떤 개념이 필요한가? 하나를 고르고, 그렇게 고른 까닭을 <b>구하고자 하는 내용과 연결하여</b> 1문장으로 쓸 것.`,   // 원문 유지: "세금이 갑자기 된다"
      type:'choices',
      groups:[{k:'c', label: String.raw`필요한 개념`, opts:['극한','연속'], ans:['연속'], fb:{'극한': String.raw`극한값만 구해서는 경계에서 세금이 ‘이어졌는가’를 말할 수 없다. 공제액을 정하는 목적은 경계에서 세금이 끊어지지 않게 하는 것이다. 한 점에서 끊어지지 않음을 뜻하는 개념은 무엇일까?`}}],
      write:{ lines:1, checklist:[String.raw`‘경계에서 세금이 갑자기 뛰지 않게/이어지게 하려고’라는 구하고자 하는 목적과 연결했다`, {t: String.raw`‘공식이 그러니까’, ‘배웠으니까’처럼 목적과 무관한 이유가 아니다`, warn:true}] },
      hints:[{ref:'p5', t: String.raw`읽기자료의 마지막 문단을 보자. \(g(x)\)는 무엇이 ‘되도록’ 만들어진 함수라고 했는가?`},
             {t: String.raw`구하고자 하는 것은 ‘경계에서 세금이 끊어지지 않고 이어지게 하는 공제액’이다. 함수가 한 점에서 끊어지지 않는 성질을 부르는 이름으로 까닭을 시작해 보자.`}],
      model: String.raw`연속. 경계에서 세금이 갑자기 뛰지 않고 이어지도록 공제액을 정하는 것이 목적이므로, 함수가 그 점에서 연속이 되는 조건이 필요하다.` },
    { id:'a2p2', no:'(2)', q: String.raw`위 (1)의 개념을 \(x=5000\)에서 확인하려면 <b>무엇과 무엇을 비교</b>해야 하는가? 비교할 대상을 모두 쓰고, 그 셋이 어떤 관계일 때 세금이 이어진다고 말할 수 있는지 1문장으로 쓸 것.`,
      type:'choices',
      groups:[{k:'o', label: String.raw`비교할 대상(모두 고를 것)`, opts:[String.raw`좌극한 \(\displaystyle\lim_{x\to 5000^-} g(x)\)`, String.raw`우극한 \(\displaystyle\lim_{x\to 5000^+} g(x)\)`, String.raw`함숫값 \(g(5000)\)`, String.raw`도함수 \(g'(5000)\)`],
               ans:[String.raw`좌극한 \(\displaystyle\lim_{x\to 5000^-} g(x)\)`, String.raw`우극한 \(\displaystyle\lim_{x\to 5000^+} g(x)\)`, String.raw`함숫값 \(g(5000)\)`], allow:[], multi:true,
               fb:{[String.raw`도함수 \(g'(5000)\)`]: String.raw`도함수는 ‘기울기’를 말한다. 세금이 이어졌는지(끊어졌는지)를 보려면 그 점 양쪽에서 다가가는 값과 그 점의 값을 보아야 한다.`}}],
      write:{ lines:1, checklist:[String.raw`좌극한·우극한·함숫값 세 가지를 모두 썼다`, String.raw`세 값이 <b>모두 같을 때</b> 세금이 이어진다고 썼다`, {t: String.raw`‘좌극한과 우극한만 같으면 된다’처럼 함숫값을 빠뜨리지 않았다`, warn:true}] },
      hints:[{ref:'f2', t: String.raw`\(x=5000\)의 왼쪽과 오른쪽에서 \(g(x)\)의 식이 서로 다르다. 왼쪽에서 다가갈 때의 값, 오른쪽에서 다가갈 때의 값, 그리고 \(x=5000\) 바로 그 점의 값 — 몇 가지를 비교해야 할까?`},
             {t: String.raw`함수가 한 점에서 연속일 조건은 ‘좌극한 = 우극한 = 함숫값’이다. 세 대상을 모두 쓰고, 이 세 값이 어떤 관계일 때 이어진다고 하는지 한 문장으로 쓰자.`}],
      model: String.raw`좌극한 · 우극한 · 함숫값 셋을 비교해야 하며, 세 값이 모두 같을 때 세금이 이어진다고 말할 수 있다.` }
  ]},
  { id:'a3', area:'Ⅱ', title: String.raw`활동 3`,
    lead: String.raw`함수 \(g(x)\)의 \(x=1400\)에서의 연속성을 조사해 보자.`,
    parts:[
    { id:'a3p1', no:'(1)', q: String.raw`\(\displaystyle\lim_{x\to 1400^-} g(x)\), \(\displaystyle\lim_{x\to 1400^+} g(x)\), \(g(1400)\)을 각각 <b>식과 값으로</b> 쓸 것.`,
      type:'fields',
      tpl: String.raw`\(\displaystyle\lim_{x\to 1400^-} g(x)=\) [r1] \(\times 1400-\) [d1] \(=\) [v1]<br>\(\displaystyle\lim_{x\to 1400^+} g(x)=\) [r2] \(\times 1400-\) [d2] \(=\) [v2]<br>\(g(1400)=\) [r3] \(\times 1400-\) [d3] \(=\) [v3]`,
      fields:[{k:'r1', label: String.raw`세율`, ans:0.06, tol:0.0005, wrong:{'0.15': String.raw`1400의 <b>왼쪽</b>에서 다가올 때는 1400보다 작은 \(x\)를 쓴다. 그 \(x\)는 어느 구간의 식을 따르는가?`}},
              {k:'d1', label: String.raw`공제액(없으면 0)`, ans:0, tol:0},
              {k:'v1', label: String.raw`값`, ans:84, tol:0.005},
              {k:'r2', label: String.raw`세율`, ans:0.15, tol:0.0005, wrong:{'0.06': String.raw`1400의 <b>오른쪽</b>에서 다가올 때는 1400보다 큰 \(x\)를 쓴다. 그 \(x\)는 어느 구간의 식을 따르는가?`}},
              {k:'d2', label: String.raw`공제액(없으면 0)`, ans:126, tol:0, wrong:{'0': String.raw`1400 초과 구간의 \(g(x)\)에는 누진 공제액이 있다. 표에서 그 구간의 공제액을 찾아보자.`}},
              {k:'v2', label: String.raw`값`, ans:84, tol:0.005, wrong:{'210': String.raw`\(0.15\times 1400=210\)은 공제 전 값, 즉 \(f(x)\)의 값이다. \(g(x)\)는 여기서 공제액 126을 빼야 한다.`}},
              {k:'r3', label: String.raw`세율`, ans:0.06, tol:0.0005, wrong:{'0.15': String.raw`\(x=1400\)은 ‘1400 <b>이하</b>’에 속한다. 등호가 어느 구간에 붙어 있는지 \(g(x)\)의 정의를 다시 보자.`}},
              {k:'d3', label: String.raw`공제액(없으면 0)`, ans:0, tol:0},
              {k:'v3', label: String.raw`값`, ans:84, tol:0.005}],
      hints:[{ref:'f2', t: String.raw`\(x=1400\)의 왼쪽에서 다가올 때는 어느 구간의 식을 쓰는가? 1400의 오른쪽에서는? 그리고 \(x=1400\) 자체는 등호가 붙은 구간에 속한다. 공제액이 ‘없음’인 칸은 0을 입력한다.`},
             {t: String.raw`왼쪽: \(0.06\times 1400\), 오른쪽: \(0.15\times 1400-126\). 함숫값은 ‘1400 이하’ 구간이므로 첫째 식 \(0.06\times 1400\)을 쓴다. 세 값을 계산해 비교해 보자.`}],
      model: String.raw`\(\displaystyle\lim_{x\to 1400^-} g(x)=0.06\times 1400=84\), \(\displaystyle\lim_{x\to 1400^+} g(x)=0.15\times 1400-126=84\), \(g(1400)=0.06\times 1400=84\) (정의상 \(0\lt x\le 1400\) 구간의 식을 쓴다)` },
    { id:'a3p2', no:'(2)', q: String.raw`세 값을 비교하여 연속인지 판단하고, 같은 지점에서 \(f(x)\)는 어떠했는지 견주어 <b>1문장</b>으로 쓸 것.`,
      type:'choices',
      groups:[{k:'c', label: String.raw`\(g(x)\)는 \(x=1400\)에서`, opts:['연속이다','불연속이다'], ans:['연속이다'], fb:{'불연속이다': String.raw`(1)에서 구한 세 값이 서로 다른가? 세 값이 모두 같으면 그 점에서 연속이다.`}}],
      write:{ lines:1, checklist:[String.raw`세 값이 모두 84로 같음을 근거로 연속이라고 판단했다`, String.raw`같은 점에서 \(f(x)\)는 84와 210으로 값이 뛰어 불연속이었다고 견주었다`] },
      hints:[{ref:'f2', t: String.raw`(1)의 세 값은 같은가? 같다면 연속의 조건이 모두 성립한다. 이제 \(f(x)\)로 같은 계산을 해 보자. 왼쪽은 \(0.06\times 1400\), 오른쪽은 \(0.15\times 1400\)이다.`},
             {t: String.raw`\(g(x)\)는 세 값이 84로 같지만 \(f(x)\)는 왼쪽 84, 오른쪽 210으로 뛴다. ‘\(g(x)\)는 … 연속이지만, \(f(x)\)는 … 불연속이었다’ 꼴로 한 문장을 만들어 보자.`}],
      model: String.raw`세 값이 모두 같으므로 연속이다. 같은 지점에서 \(f(x)\)는 84와 210으로 값이 뛰어 불연속이었다.` }
  ]},
  { id:'a4', area:'Ⅱ', title: String.raw`활동 4`,
    lead: String.raw`함수 \(g(x)\)가 \(x=5000\)에서 <b>연속이 되도록</b> 누진 공제액 \(k\)를 정해 보자.`,
    parts:[
    { id:'a4p1', no:'(1)', q: String.raw`연속이 되기 위한 조건을 <b>극한과 함숫값을 사용한 등식</b>으로 세울 것.`,
      type:'fields',
      tpl: String.raw`\(\displaystyle\lim_{x\to 5000^-} g(x)=0.15\times 5000-126=\) [l]<br>\(\displaystyle\lim_{x\to 5000^+} g(x)=0.24\times 5000-k=\) [r] \(-k\)<br>\(g(5000)=\) [v]<br>연속 조건: [eL] \(=\) [eR] \(-k\)`,
      fields:[{k:'l', label: String.raw`좌극한`, ans:624, tol:0.005, wrong:{'750': String.raw`750은 \(f(5000)\)이다. \(g(x)\)는 공제액 126을 빼야 한다.`}},
              {k:'r', label: String.raw`\(0.24\times 5000\)`, ans:1200, tol:0.005},
              {k:'v', label: String.raw`함숫값`, ans:624, tol:0.005, wrong:{'1200': String.raw`\(x=5000\)은 ‘1400 초과 5000 <b>이하</b>’에 속한다. 함숫값은 어느 구간의 식으로 구해야 할까?`}},
              {k:'eL', label: String.raw`등식 좌변`, ans:624, tol:0.005},
              {k:'eR', label: String.raw`등식 우변`, ans:1200, tol:0.005}],
      write:{ lines:1, checklist:[String.raw`좌극한, 우극한(\(k\) 포함), 함숫값을 각각 식으로 썼다`, String.raw`‘(좌극한) = (우극한) = \(g(5000)\)’ 꼴의 등식으로 연속 조건을 세웠다`, {t: String.raw`표의 규칙을 보고 \(k\)를 바로 적지 않고, 등식에서 \(k\)가 나오도록 세웠다`, warn:true}] },
      hints:[{ref:'f2', t: String.raw`\(x=5000\)의 왼쪽 식은 \(0.15x-126\), 오른쪽 식은 \(0.24x-k\)이다. 각각 5000을 넣어 보자. \(k\)는 모르는 수이므로 그대로 둔다.`},
             {t: String.raw`연속이려면 (좌극한) = (우극한) = \(g(5000)\)이어야 한다. \(624=1200-k\)처럼 \(k\)가 들어 있는 등식을 세우자.`}],
      model: String.raw`\(\displaystyle\lim_{x\to 5000^-} g(x)=0.15\times 5000-126=624\), \(\displaystyle\lim_{x\to 5000^+} g(x)=0.24\times 5000-k=1200-k\), \(g(5000)=624\)이므로 연속이려면 \(624=1200-k\).` },
    { id:'a4p2', no:'(2)', q: String.raw`그 등식을 풀어 \(k\)의 값을 구할 것.`,
      type:'fields',
      fields:[{k:'k', label: String.raw`\(k=\)`, ans:576, tol:0.005, wrong:{'126': String.raw`126은 앞 구간의 공제액이다. (1)에서 세운 등식 \(624=1200-k\)를 \(k\)에 대하여 풀자.`, '1544': String.raw`1544는 다음 구간의 공제액이다. (1)에서 세운 등식을 \(k\)에 대하여 풀자.`}}],
      write:{ lines:1, checklist:[String.raw`(1)의 등식을 정리하여 \(k\)를 구하는 과정을 썼다`, String.raw`구한 \(k=576\)이 연속 조건에서 나온 값임이 드러난다`] },
      hints:[{t: String.raw`(1)에서 세운 등식 \(624=1200-k\)에서 \(k\)를 좌변으로 옮겨 보자.`},
             {t: String.raw`(1)의 등식을 \(k=\square\) 꼴로 정리한 뒤 계산하자. 구한 값이 표의 빈칸 \(k\)에 들어갈 값인지 확인한다.`}],
      model: String.raw`\(624=1200-k\)에서 \(k=1200-624=576\).` },
    { id:'a4p3', no:'(3)', q: String.raw`구한 \(k\)를 활동 1의 결과와 견주어, 누진 공제가 한 일을 <b>1문장</b>으로 쓸 것.`,
      type:'none',
      write:{ lines:1, checklist:[String.raw`활동 1의 경계에서의 세금 차이(450.24만 원)를 언급했다`, String.raw`누진 공제가 그 차이를 없애고 세액이 <b>이어지도록</b> 만들었다고 썼다`] },
      hints:[{ref:'p4', t: String.raw`활동 1에서 누진 공제가 없을 때 경계에서 세금이 얼마나 벌어졌는지 떠올려 보자. \(k=576\)을 넣으면 \(x=5000\) 양쪽의 \(g(x)\)는 어떻게 되는가?`},
             {t: String.raw`‘누진 공제는 경계에서 450만 원 넘게 벌어지던 세금 차이를 …’로 시작해, 세액이 어떻게 되었는지로 문장을 끝내 보자.`}],
      model: String.raw`누진 공제는 경계에서 450만 원 넘게 벌어지던 세금 차이를 없애고 세액이 이어지도록 만들어 준다.` }
  ]},
  { id:'a5', area:'Ⅱ', title: String.raw`활동 5`,
    parts:[
    { id:'a5p1', no:'', q: String.raw`표에 주어진 누진 공제액 <b>1544</b>가 옳게 정해진 값인지 확인해 보자. 함수 \(g(x)\)가 \(x=8800\)에서 연속인지 <b>좌극한과 우극한을 계산하여</b> 판단하고, 그 결과를 한 문장으로 쓰시오. (활동 4에서 구한 \(k\)를 사용할 것)`,
      type:'fields',
      tpl: String.raw`\(\displaystyle\lim_{x\to 8800^-} g(x)=0.24\times 8800-\) [d1] \(=\) [v1]<br>\(\displaystyle\lim_{x\to 8800^+} g(x)=0.35\times 8800-\) [d2] \(=\) [v2]<br>\(g(8800)=\) [v3]`,
      fields:[{k:'d1', label: String.raw`공제액 \(k\)`, ans:576, tol:0, wrong:{'126': String.raw`126은 1400 초과 5000 이하 구간의 공제액이다. 8800의 왼쪽은 어느 구간이며, 그 공제액은 활동 4에서 얼마로 정했는가?`}},
              {k:'v1', label: String.raw`좌극한`, ans:1536, tol:0.005, wrong:{'2112': String.raw`\(0.24\times 8800=2112\)는 공제 전 값이다. 공제액 576을 빼야 \(g(x)\)이다.`}},
              {k:'d2', label: String.raw`공제액`, ans:1544, tol:0},
              {k:'v2', label: String.raw`우극한`, ans:1536, tol:0.005, wrong:{'3080': String.raw`\(0.35\times 8800=3080\)은 공제 전 값이다. 공제액 1544를 빼야 \(g(x)\)이다.`}},
              {k:'v3', label: String.raw`함숫값`, ans:1536, tol:0.005}],
      write:{ lines:1, checklist:[String.raw`좌극한·우극한(·함숫값)이 모두 1536으로 같음을 근거로 들었다`, String.raw`\(x=8800\)에서 연속이라고 판단했다`, String.raw`따라서 1544는 옳게 정해진 값이라는 결론을 썼다`] },
      hints:[{ref:'f2', t: String.raw`\(x=8800\)의 왼쪽 식은 \(0.24x-k\)(활동 4의 \(k=576\)), 오른쪽 식은 \(0.35x-1544\)이다. 각각 8800을 넣어 보자.`},
             {t: String.raw`\(2112-576\)과 \(3080-1544\)를 계산해 보자. 두 값이 같고 함숫값(‘8800 이하’ 구간의 식)도 같다면, 1544는 연속이 되게 하는 값이다.`}],
      model: String.raw`\(\displaystyle\lim_{x\to 8800^-} g(x)=0.24\times 8800-576=2112-576=1536\), \(\displaystyle\lim_{x\to 8800^+} g(x)=0.35\times 8800-1544=3080-1544=1536\). \(g(8800)=1536\)으로 세 값이 같으므로 연속이다. 따라서 표의 누진 공제액 1544는 옳게 정해진 값이다. (활동 4에서 \(k\)를 틀렸더라도 그 값을 일관되게 사용했다면 좌극한 계산은 인정된다.)` }
  ]},
  { id:'a6', area:'Ⅱ', title: String.raw`활동 6`,
    lead: String.raw`함수 \(y=g(x)\)의 그래프를 그려 보고 연속인지 확인해 보자. 아래 표를 채운 뒤 좌표평면에 <b>네 점을 찍고 원점에서부터 차례로 선분으로 이으시오.</b>`,
    parts:[
    { id:'a6p1', no:'•', q: String.raw`표 채우기와 점 찍어 잇기`,
      aside: String.raw`점을 찍고 선분으로 잇는 것은 <b>공책이나 활동지에 직접</b> 해 보자. 앱에서는 아래 표를 채우고, 다 그린 뒤 스스로 점검하면 된다.`,
      fig:'tax_grid',
      type:'grid', head: String.raw`\(x\)`,
      cols:['1400','5000','8800','15000'],
      rows:[{label: String.raw`\(g(x)\)`, ans:[84,624,1536,3706], tol:0.005}],
      write:{ lines:1, checklist:[String.raw`종이(또는 그림)에 네 점 (1400, 84), (5000, 624), (8800, 1536), (15000, 3706)을 찍었다`, String.raw`원점에서부터 네 점을 차례로 선분으로 이었다`, String.raw`그래프가 오른쪽으로 갈수록 올라가며, 각 경계에서 점점 가파르게 꺾이는 모양이 되었다`] },
      hints:[{ref:'f2', t: String.raw`1400, 5000, 8800의 \(g(x)\) 값은 활동 3·4·5에서 이미 구했다. 15000은 어느 구간의 식을 써야 할까?`},
             {t: String.raw`\(g(15000)=0.35\times 15000-1544\)이다. 네 점을 찍은 뒤 원점 → (1400, 84) → (5000, 624) → … 순서로 선분을 이어 보자. 눈금에 정확히 맞추지 못해도 순서와 증가 경향이 맞으면 된다.`}],
      model: String.raw`\(g(1400)=84\), \(g(5000)=624\), \(g(8800)=1536\), \(g(15000)=0.35\times 15000-1544=5250-1544=3706\). 네 점을 원점에서부터 차례로 이으면 끊어진 곳 없이 이어지되 각 경계에서 기울기가 커지며 꺾인다.` },
    { id:'a6p2', no:'•', q: String.raw`그래프에 <b>끊어진 곳이 있는지</b> 한 줄로 쓰기`,
      type:'choices',
      groups:[{k:'c', label: String.raw`그래프는`, opts:['끊어진 곳이 없다','끊어진 곳이 있다'], ans:['끊어진 곳이 없다'], fb:{'끊어진 곳이 있다': String.raw`네 점을 선분으로 이었을 때 떨어진 곳이 있었는가? ‘꺾인 곳’과 ‘끊어진 곳’은 다르다.`}}],
      write:{ lines:1, checklist:[String.raw`끊어진 곳이 없다(연속이다)고 썼다`, String.raw`(선택) 이어져 있지만 경계에서 꺾인다는 점을 덧붙였다`] },
      hints:[{ref:'f2', t: String.raw`활동 3·4·5에서 세 경계점의 좌극한·우극한·함숫값이 모두 같았다. 그래프에서는 이것이 어떻게 나타날까?`},
             {t: String.raw`선분들이 끝점에서 서로 만나므로 떨어진 곳이 없다. ‘끊어진 곳은 없지만 …에서 꺾인다’처럼 한 줄로 쓰자.`}],
      model: String.raw`끊어진 곳이 없다(연속이다). 다만 각 경계에서 기울기가 커지며 꺾인다.` }
  ]},
  { id:'a7', area:'Ⅲ', title: String.raw`활동 7`,
    lead: String.raw`그래프는 이어져 있지만 <b>꺾인 곳</b>이 있다. 그 까닭을 도함수로 살펴보자.`,
    parts:[
    { id:'a7p1', no:'(1)', q: String.raw`\(1400\lt x\lt 5000\)과 \(5000\lt x\lt 8800\)에서 각각 \(g'(x)\)를 구할 것.`,
      type:'fields',
      fields:[{k:'g1', label: String.raw`\(1400\lt x\lt 5000\)에서 \(g'(x)=\)`, ans:0.15, tol:0.0005, wrong:{'126': String.raw`\(0.15x-126\)을 \(x\)로 미분하면 상수항 126은 어떻게 되는가?`}},
              {k:'g2', label: String.raw`\(5000\lt x\lt 8800\)에서 \(g'(x)=\)`, ans:0.24, tol:0.0005, wrong:{'576': String.raw`\(0.24x-576\)을 \(x\)로 미분하면 상수항은 사라진다. 남는 것은 무엇인가?`}}],
      hints:[{ref:'f2', t: String.raw`두 구간에서 \(g(x)\)는 각각 \(0.15x-126\), \(0.24x-k\)이다. 일차함수 \(ax+b\)의 도함수는 무엇인가?`},
             {t: String.raw`\((0.15x-126)'=0.15\)처럼 상수항은 미분하면 0이 된다. 두 구간의 도함수는 각각 \(x\)의 계수이다.`}],
      model: String.raw`\(1400\lt x\lt 5000\)에서 \(g'(x)=0.15\), \(5000\lt x\lt 8800\)에서 \(g'(x)=0.24\)` },
    { id:'a7p2', no:'(2)', q: String.raw`두 값을 이용하여, 과세 표준이 <b>1만 원 늘어날 때 세금이 얼마씩 늘어나는지</b>를 두 구간에서 각각 쓸 것.`,
      type:'fields',
      fields:[{k:'i1', label: String.raw`\(1400\lt x\lt 5000\): 1만 원당`, ans:0.15, tol:0.0005, suffix: String.raw`만 원`, wrong:{'1500': String.raw`1500원은 맞는 양이지만 이 칸의 단위는 ‘만 원’이다. 1500원을 만 원 단위로 바꾸면?`}},
              {k:'i2', label: String.raw`\(5000\lt x\lt 8800\): 1만 원당`, ans:0.24, tol:0.0005, suffix: String.raw`만 원`, wrong:{'2400': String.raw`2400원은 맞는 양이지만 이 칸의 단위는 ‘만 원’이다. 2400원을 만 원 단위로 바꾸면?`}}],
      hints:[{ref:'p4', t: String.raw`\(x\)의 단위는 만 원이다. 도함수 \(g'(x)\)는 ‘\(x\)가 1(만 원) 늘 때 \(g(x)\)가 얼마나 느는가’를 뜻한다.`},
             {t: String.raw`(1)에서 구한 두 값이 그대로 답이다. \(x\)가 만 원 단위이므로 이 칸에도 ‘만 원’ 단위로 입력하자. (원으로 바꾸려면 10000을 곱한다.)`}],
      model: String.raw`과세 표준이 1만 원 늘 때 세금은 각각 0.15만 원(1500원), 0.24만 원(2400원)씩 늘어난다.` },
    { id:'a7p3', no:'(3)', q: String.raw`위 결과가 표의 <b>세율</b>과 어떤 관계인지 <b>1문장</b>으로 쓸 것.`,
      type:'none',
      write:{ lines:1, checklist:[String.raw`각 구간에서 도함수의 값이 그 구간의 <b>세율과 같다</b>고 썼다`, String.raw`경계에서 도함수의 값이 달라지므로 그래프가 꺾인다고 연결했다`, {t: String.raw`‘기울기가 다르다’에서 멈추지 않고 세율과의 관계를 밝혔다`, warn:true}] },
      hints:[{ref:'tbl1', t: String.raw`(1)에서 구한 0.15, 0.24를 표의 세율 15 %, 24 %와 견주어 보자.`},
             {t: String.raw`‘각 구간에서 도함수의 값은 …과 같다’로 쓰고, 경계에서 그 값이 달라지기 때문에 그래프가 어떻게 되는지 덧붙여 보자.`}],
      model: String.raw`각 구간에서 도함수의 값은 그 구간의 세율과 같다. 경계에서 도함수의 값이 달라지므로 그래프가 꺾인다. (경계에서의 미분가능성은 묻지 않았다. “\(x=5000\)에서는 미분할 수 없다”고 덧붙인 답안은 정확한 인식이다.)` }
  ]},
  { id:'a8', area:'Ⅲ', title: String.raw`활동 8`,
    lead: String.raw`이제 <b>여러분이 직접 제도를 설계해 보자.</b> 정부가 위 표에 다음과 같은 구간을 새로 추가하려고 한다.
 <table class="tbl" data-ref="tbl2">
  <thead><tr><th>과세 표준 금액</th><th>세율</th><th>누진 공제액</th></tr></thead>
  <tbody><tr><td>15000 초과 30000 이하</td><td>38 %</td><td>\(a\)</td></tr></tbody>
 </table>`,
    parts:[
    { id:'a8p1', no:'(1)', q: String.raw`새 구간을 포함한 \(g(x)\)가 \(x=15000\)에서도 <b>연속이 되도록</b> 누진 공제액 \(a\)를 정하시오. 등식을 세우는 과정을 반드시 쓸 것.`,
      type:'fields',
      tpl: String.raw`\(\displaystyle\lim_{x\to 15000^-} g(x)=0.35\times 15000-1544=\) [l]<br>\(\displaystyle\lim_{x\to 15000^+} g(x)=\) [r] \(\times 15000-a=\) [v] \(-a\)<br>연속 조건: [eL] \(=\) [eR] \(-a\)<br>\(a=\) [a]`,
      fields:[{k:'l', label: String.raw`좌극한`, ans:3706, tol:0.005, wrong:{'5250': String.raw`\(0.35\times 15000=5250\)은 공제 전 값이다. 공제액 1544를 빼야 \(g(x)\)이다.`}},
              {k:'r', label: String.raw`새 구간 세율`, ans:0.38, tol:0.0005},
              {k:'v', label: String.raw`\(0.38\times 15000\)`, ans:5700, tol:0.005},
              {k:'eL', label: String.raw`등식 좌변`, ans:3706, tol:0.005},
              {k:'eR', label: String.raw`등식 우변`, ans:5700, tol:0.005},
              {k:'a', label: String.raw`\(a\)`, ans:1994, tol:0.005, wrong:{'1544': String.raw`표의 값을 그대로 쓰지 말고, \(x=15000\)에서 좌극한과 우극한이 같아지는 조건에서 구하자.`, '3706': String.raw`3706은 좌극한이다. \(a\)는 등식 \(3706=5700-a\)를 풀어야 나온다.`}}],
      write:{ lines:1, checklist:[String.raw`\(x=15000\)에서의 좌극한과 \(a\)를 포함한 우극한을 각각 식으로 썼다`, String.raw`‘(좌극한) = (우극한)’ 꼴의 등식을 세운 과정을 썼다`, String.raw`등식을 풀어 \(a=1994\)를 구했다`] },
      hints:[{ref:'tbl1', t: String.raw`\(x=15000\)의 왼쪽은 \(0.35x-1544\), 오른쪽은 새 구간 \(0.38x-a\)이다. 활동 4에서 \(k\)를 구한 방법을 그대로 쓰자.`},
             {t: String.raw`좌극한 \(0.35\times 15000-1544=3706\), 우극한 \(0.38\times 15000-a=5700-a\). 연속이려면 \(3706=5700-a\)이다.`}],
      model: String.raw`\(\displaystyle\lim_{x\to 15000^-} g(x)=0.35\times 15000-1544=3706\), \(\displaystyle\lim_{x\to 15000^+} g(x)=0.38\times 15000-a=5700-a\). 연속이려면 \(3706=5700-a\)이므로 \(a=1994\). (이 값은 실제 2023년 세법에서 1억 5000만 원 초과 3억 원 이하 구간의 누진 공제액과 정확히 같다.)` },
    { id:'a8p2', no:'(2)', q: String.raw`만약 \(a\)를 이보다 <b>작게</b> 정한다면 과세 표준이 1억 5000만 원을 갓 넘긴 사람에게 어떤 일이 생기는지 <b>1문장</b>으로 쓸 것.`,
      type:'none',
      write:{ lines:1, checklist:[String.raw`\(x=15000\) 바로 오른쪽에서 세금이 갑자기 뛴다고 썼다`, String.raw`1억 5000만 원을 갓 넘긴 사람이 그보다 소득이 적은 사람보다 손에 쥐는 돈이 적어진다(역전)고 썼다`] },
      hints:[{t: String.raw`우극한은 \(5700-a\)이다. \(a\)가 1994보다 작아지면 우극한은 3706보다 커질까, 작아질까?`},
             {t: String.raw`우극한이 좌극한보다 커지면 경계 바로 오른쪽에서 세금이 뛰어오른다. 활동 1-(2)에서 본 것과 같은 일이 일어난다. 그 사람에게 어떤 일이 생기는지 써 보자.`}],
      model: String.raw`\(a\)를 1994보다 작게 정하면 \(x=15000\) 바로 오른쪽에서 세금이 갑자기 뛰어오르므로, 1억 5000만 원을 갓 넘긴 사람이 그보다 소득이 적은 사람보다 손에 쥐는 돈이 적어지는 일이 생긴다.` }
  ]},
  { id:'a9', area:'Ⅲ', title: String.raw`활동 9`,
    lead: String.raw`어떤 사람이 다음과 같이 주장하였다.`,
    quote: String.raw`“누진 공제는 부자에게 세금을 깎아 주려고 만든 것이다.”`,
    parts:[
    { id:'a9p1', no:'', q: String.raw`이 주장이 타당한지를 <b>3~5문장</b>으로 판단하여 쓰시오. 다음 두 가지를 <b>반드시 근거로 포함</b>해야 한다.<br>① 활동 1에서 계산한 <b>누진 공제가 없을 때의 세금 차이</b><br>② 활동 4·8에서 공제액을 정한 방법, 즉 <b>함수가 연속이 되도록 정했다</b>는 사실<br><span class="sub">채점 기준 — 판단의 명확성 2점 / 근거 ① 4점 / 근거 ② 4점 / 문장의 논리적 연결 2점</span>`,
      type:'none',
      write:{ lines:5, checklist:[String.raw`‘타당하다/타당하지 않다’를 분명히 밝혔다`, String.raw`근거 ①: 활동 1의 구체적 수치(750, 1200.24 또는 450.24)로 불연속의 불합리를 들었다`, String.raw`근거 ②: 공제액이 <b>연속 조건</b>으로 정해졌음을 명시했다(‘계산해서 나온 값’만으로는 부족)`, String.raw`두 근거가 판단을 뒷받침하며 이어진다(단순 나열이 아니다)`] },
      hints:[{ref:'p4', t: String.raw`공제액이 없을 때 경계에서 무슨 일이 생겼는지(활동 1), 공제액이 어떤 조건으로 정해졌는지(활동 4·8)를 먼저 한 줄씩 떠올려 보자. 공제액은 ‘누구에게 유리하게’ 정해졌는가, 아니면 ‘무엇이 되도록’ 정해졌는가?`},
             {t: String.raw`① 750 · 1200.24 · 450.24 같은 수치로 불합리를 보이고, ② 공제액은 좌극한 = 우극한 = 함숫값, 즉 연속이 되도록 정해진 값임을 말한 뒤, 두 근거로부터 판단을 이끌어 내자. ‘타당하다’고 판단하더라도 근거가 수학적이면 인정된다.`}],
      model: String.raw`이 주장은 타당하지 않다. 누진 공제가 없다면 과세 표준이 5000만 원인 사람은 750만 원, 5001만 원인 사람은 1200.24만 원을 내게 되어 소득이 1만 원 많다는 이유로 450.24만 원을 더 내야 한다. 누진 공제액은 이런 일이 없도록 각 경계에서 좌극한과 우극한, 함숫값이 모두 같아지게, 즉 함수 \(g(x)\)가 연속이 되도록 정해진 값이다. 실제로 활동 8에서 새 구간의 공제액도 오직 연속 조건만으로 정해졌다. 따라서 누진 공제는 특정 계층의 세금을 깎아 주는 장치가 아니라 경계에서 세금이 갑자기 뛰지 않게 하는 수학적 장치이다. (“타당하다”고 판단한 답안도 근거가 수학적이면 부분 점수를 준다. 예컨대 “공제액이 고소득 구간일수록 크므로 절대 금액으로는 고소득자가 더 많이 공제받는다”는 지적은 표를 정확히 읽은 것이다. 다만 근거 ②가 빠지면 해당 점수는 없다.)` }
  ]}
  ],
  criteria: {

  reading: String.raw`<div class="reading">
 <p data-ref="p1">심장은 수축과 이완을 반복하며 온몸에 혈액을 순환시킨다. 심장이 수축하려면 먼저 전기 자극이 필요하다. 이 자극은 심장의 오른쪽 위에서 만들어져 아래쪽으로 전달되는데, 자극을 받은 <b>심근세포</b>는 전기가 흐르지 않던 상태에서 전기가 흐르는 상태로 바뀐다. 이를 <b>탈분극</b>이라 하고, 다시 원래 상태로 돌아가는 것을 <b>재분극</b>이라 한다. 탈분극이 인접한 세포로 차례차례 전달되면서 심장은 수축하고, 재분극이 일어나면 이완한다.</p>
 <p data-ref="p2">이러한 전기 활동으로 생기는 <b>전위차</b>를 시간의 흐름에 따라 그래프로 나타낸 것이 <b>심전도</b>이다. 가로축은 시간, 세로축은 전위차를 나타내며, 전기 활동이 없어 전위차가 0인 기준선을 <b>기저선</b>이라 한다. 검사할 때는 몸에 전극을 붙여 신체 표면에 전달되는 미세한 전기 활동을 감지하는데, 탈분극이 전극을 향해 진행하면 파형은 기저선 <b>위쪽</b>으로, 전극에서 멀어지는 방향으로 진행하면 <b>아래쪽</b>으로 그려진다.</p>

 <p data-ref="p4">실제 심전도의 모양은 훨씬 복잡하지만, 이 활동에서는 함수의 극한과 연속을 탐구하기 위해 한 번의 심장 박동을 <b>직선과 이차함수만으로 단순화한 교육용 수학 모델</b>로 나타낸다. P파와 T파는 완만한 곡선이므로 이차함수로, 짧은 시간에 급격히 변하는 QRS파는 직선의 방정식으로 표현하였다. 이 모델은 실제 환자의 심전도 수치를 재현하기 위한 것이 아니다.</p>

             {t: String.raw`첫 문장은 두 지점의 연속 판단, 둘째 문장은 ‘구간마다 식이 다르더라도 경계에서 세 값이 … 하면 …’으로 까닭을 쓰자.`}],

  { id:'a4', area:'Ⅱ', title: String.raw`활동 4`,
    lead: String.raw`심전도 모델을 저장하던 중 <b>R파에서 S파로 내려가는 직선의 식이 지워졌다.</b> 그 구간을 \(y=at+b\)라 하면 이 부분은 다음과 같다.

이 모델이 \(t=6\)과 \(t=\dfrac{13}{2}\)에서 모두 <b>연속</b>이라고 한다.`,

    { id:'a4p1', no:'(1)', q: String.raw`\(t=6\)에서 연속이 되기 위한 조건을 \(a,\ b\)에 대한 식으로 나타낼 것.`,
      type:'fields',
      tpl: String.raw`\(t=6\)에서 좌극한은 [l] , 우극한과 함숫값은 [p] \(a+b\) 이므로 조건은 [p2] \(a+b=\) [v]`,

             {t: String.raw`연속이려면 (좌극한) = (우극한) = (함숫값)이다. 양쪽 식에 각각 \(t=6\)을 대입해 두 값을 구한 뒤, 그 둘이 같다는 식을 세우자.`}],
      model: String.raw`\(t=6\)에서 좌극한은 \(10\cdot6-56=4\), 우극한과 함숫값은 \(6a+b\)이므로 \(6a+b=4\)` },
    { id:'a4p2', no:'(2)', q: String.raw`\(t=\dfrac{13}{2}\)에서 연속이 되기 위한 조건을 \(a,\ b\)에 대한 식으로 나타낼 것.`,

      fields:[{k:'p', label: String.raw`\(a\)의 계수`, ans:'13/2', tol:0.001},

      hints:[{t: String.raw`이번에는 \(at+b\)가 왼쪽 구간이고 \(4t-28\)이 오른쪽 구간이다. 어느 쪽이 좌극한이고 어느 쪽이 우극한·함숫값인지 (1)과 반대임에 주의하자.`},
             {t: String.raw`(1)과 같은 방법으로 양쪽 식에 \(t=\frac{13}{2}\)를 대입해 두 값을 구하고, 두 값이 같다는 식을 세우자. (분수는 13/2 또는 6.5로 입력)`}],
      model: String.raw`\(t=\dfrac{13}{2}\)에서 좌극한은 \(\dfrac{13}{2}a+b\), 우극한과 함숫값은 \(4\cdot\dfrac{13}{2}-28=-2\)이므로 \(\dfrac{13}{2}a+b=-2\)` },
    { id:'a4p3', no:'(3)', q: String.raw`두 조건을 연립하여 \(a,\ b\)를 구하고, 그 결과가 원래 함수식과 일치하는지 확인할 것.`,

      fields:[{k:'a', label: String.raw`\(a=\)`, ans:-12, tol:0},{k:'b', label: String.raw`\(b=\)`, ans:76, tol:0}],
      write:{ lines:2, checklist:[String.raw`두 조건식 \(6a+b=4\), \(\frac{13}{2}a+b=-2\)를 연립하는 과정(두 식을 빼서 \(\frac12a=-6\))을 썼다`, String.raw`\(a=-12\), \(b=76\)을 구했다`, String.raw`\(y=-12t+76\)이 원래 함수식 \(E(t)\)의 \(6\le t<\frac{13}{2}\) 구간의 식과 일치함을 확인했다`, String.raw`두 점 \((6,4)\), \(\left(\frac{13}{2},-2\right)\)를 지나는 직선으로 구했다면, 그 두 점이 <b>연속 조건</b>에서 나온 것임을 밝혔다`] },
      hints:[{t: String.raw`(1)의 \(6a+b=4\)와 (2)의 \(\frac{13}{2}a+b=-2\)에서 \(b\)의 계수가 같다. 두 식을 빼면 \(a\)만 남는다.`},
             {t: String.raw`\(\left(\frac{13}{2}-6\right)a=-2-4\)에서 \(a\)를 구한 뒤 \(6a+b=4\)에 대입해 \(b\)를 구하자. 그리고 \(E(t)\)의 \(6\le t<\frac{13}{2}\) 구간 식과 비교하자.`}],
      model: String.raw`두 식을 빼면 \(\dfrac12a=-6\)이므로 \(a=-12\), 이를 대입하면 \(b=4+72=76\). 따라서 \(y=-12t+76\)으로 원래 함수식과 일치한다. (두 점 \((6,4)\), \(\left(\frac{13}{2},-2\right)\)를 지나는 직선의 기울기로 바로 구한 답안도 결과는 같다. 연속 조건에서 그 두 점이 나온다는 서술이 있으면 만점.)` }
