      type:'choices',
      groups:[{k:'L', label: String.raw`\(\displaystyle\lim_{t\to10}G(t)\)`, opts:['1','3','존재하지 않는다'], ans:['1'],
               fb:{'3': String.raw`\(t\ne10\)에서 \(G(t)\)는 \(E(t)\)와 같다. \(t\)가 10에 가까워질 때 값은 \(G(10)\)이 아니라 \(E(t)\)가 다가가는 값이다. 그 값은?`, '존재하지 않는다': String.raw`10의 양쪽에서 모두 같은 식 \(-\frac14(t-8)(t-12)\)를 쓴다. 좌극한과 우극한이 다를 수 있을까?`}},
              {k:'V', label: String.raw`\(G(10)\)`, opts:['1','3'], ans:['3'], fb:{'1': String.raw`\(G(t)\)의 정의에서 \(t=10\)일 때의 값은 무엇으로 저장되어 있는가?`}},
              {k:'C', label: String.raw`\(t=10\)에서`, opts:['연속이다','불연속이다'], ans:['불연속이다'],
               fb:{'연속이다': String.raw`극한값 1과 함숫값 3이 같은가? 극한값이 존재하는 것과 연속인 것은 같은 조건일까?`}}],
      write:{ lines:1, checklist:[String.raw`극한값(1)과 함숫값(3)이 다르다는 것을 불연속의 근거로 썼다`, String.raw`극한값은 존재하지만 연속은 아니라는 점을 구분했다`, {t: String.raw`‘극한값이 존재하므로 연속이다’라고 쓰지 않았다`, warn:true}] },
      hints:[{ref:'f1', t: String.raw`\(t\ne10\)에서는 \(G(t)=E(t)\)이다. \(t=10\) 근처에서 \(E(t)\)는 어떤 식인가? 그 식에 10을 넣으면 극한값이 나온다. 함숫값은 \(G(t)\)의 정의에서 따로 읽자.`},
             {t: String.raw`연속의 조건은 세 값이 모두 같아야 한다는 것이다. 극한값과 함숫값을 비교해 보자. 극한값이 ‘있다’는 것만으로 충분한가?`}],
      model: String.raw`\(t\ne10\)에서는 \(E(t)\)와 같으므로 \(\displaystyle\lim_{t\to10}G(t)=1\)이지만 \(G(10)=3\)이다. 극한값과 함숫값이 다르므로 불연속이다. (극한값은 존재한다.)` },
    { id:'a5p2', no:'(2)', q: String.raw`기록 ②에서 \(\displaystyle\lim_{t\to6^-}H(t)\)와 \(\displaystyle\lim_{t\to6^+}H(t)\)를 구하고, \(\displaystyle\lim_{t\to6}H(t)\)가 존재하는지 판단할 것.`,
      type:'fields',
      fields:[{k:'l', label: String.raw`\(\displaystyle\lim_{t\to6^-}H(t)=\)`, ans:4, tol:0},
              {k:'r', label: String.raw`\(\displaystyle\lim_{t\to6^+}H(t)=\)`, ans:8, tol:0, wrong:{'4': String.raw`\(t\ge6\)에서 \(H(t)\)는 \(E(t)\)가 아니라 \(-12t+80\)이다. 이 식에 6을 넣어 보자.`}}],
      write:{ lines:1, checklist:[String.raw`좌극한 4와 우극한 8이 서로 다르다는 것을 근거로 썼다`, String.raw`\(\displaystyle\lim_{t\to6}H(t)\)가 존재하지 않는다고 판단했다`] },
      hints:[{t: String.raw`\(t<6\)에서는 \(H(t)=E(t)\)이므로 좌극한은 활동 3-(2)에서 구한 값과 같다. \(t\ge6\)에서는 식이 \(-12t+80\)으로 바뀌었다.`},
             {t: String.raw`\(-12\cdot6+80\)을 계산해 좌극한과 비교하자. 극한값이 존재하려면 좌극한과 우극한이 어떠해야 하는가?`}],
      model: String.raw`\(\displaystyle\lim_{t\to6^-}H(t)=10\cdot6-56=4\), \(\displaystyle\lim_{t\to6^+}H(t)=-12\cdot6+80=8\). 좌극한과 우극한이 다르므로 \(\displaystyle\lim_{t\to6}H(t)\)는 존재하지 않는다.` },
    { id:'a5p3', no:'(3)', q: String.raw`두 오류 중 <b>함숫값 하나만 고쳐서 연속으로 만들 수 있는 것</b>은 어느 쪽인지 고르고, 그 까닭을 <b>좌극한·우극한·함숫값</b>을 모두 사용하여 3문장 이내로 쓸 것.`,
      type:'choices',
      groups:[{k:'c', label: String.raw`함숫값 하나만 고쳐서 연속으로 만들 수 있는 것`, opts:['기록 ①','기록 ②'], ans:['기록 ①'],
               fb:{'기록 ②': String.raw`②는 좌극한 4, 우극한 8이다. \(H(6)\) 하나를 어떤 수로 바꾸든 이 두 값이 같아질까?`}}],
      write:{ lines:3, checklist:[String.raw`①은 좌극한과 우극한이 모두 1로 같아 극한값이 존재한다고 썼다`, String.raw`함숫값을 1로 바꾸면 세 값이 같아져 연속이 된다고 썼다`, String.raw`②는 좌극한 4와 우극한 8이 달라 극한값 자체가 없으므로 함숫값을 어떤 수로 바꾸어도 연속이 될 수 없다고 썼다`, {t: String.raw`‘극한값이 존재하면 연속이다’라는 표현을 쓰지 않았다`, warn:true}] },
      hints:[{t: String.raw`연속이 되려면 좌극한 = 우극한 = 함숫값이어야 한다. 함숫값 하나를 바꿔서 이 등식을 만들 수 있으려면, 좌극한과 우극한은 이미 어떤 상태여야 할까?`},
             {t: String.raw`(1)과 (2)에서 구한 좌극한과 우극한을 각각 다시 보자. 두 값이 같은 기록과 다른 기록 중, 함숫값 하나만 바꿔 연속으로 만들 수 있는 쪽은 어디인가? 각각 한 문장씩 쓰자.`}],
      model: String.raw`고칠 수 있는 것은 기록 ①이다. ①은 좌극한과 우극한이 모두 1로 같아 극한값이 존재하므로, 함숫값을 1로 바꾸면 세 값이 같아져 연속이 된다. 반면 ②는 좌극한 4와 우극한 8이 서로 달라 극한값 자체가 없으므로, 함숫값을 어떤 수로 바꾸어도 연속으로 만들 수 없다.` }
  ]},
  { id:'a6', area:'Ⅲ', title: String.raw`활동 6`,
    lead: String.raw`같은 사람의 심전도를 여러 번 기록하였더니, 앞의 \(E(t)\)와 달리 아래 두 함수 \(A(t)\), \(B(t)\)와 같은 결과가 나타났다. 두 함수 모두 <b>아래에 제시한 구간 외에는 \(E(t)\)와 같다.</b><br><br>
<b>\(A(t)\)</b>&nbsp; P파 구간의 식이 \((t-2)(t-4)\ \ (2\le t<4)\)로 바뀌었다.<br><br>
<b>\(B(t)\)</b>&nbsp; QRS파 구간의 식이 다음과 같이 바뀌었다.
\[\begin{cases}-t+4 & (4\le t<5)\\ 5t-26 & (5\le t<6)\\ -6t+40 & (6\le t<7)\\ 2t-16 & (7\le t<8)\end{cases}\]`,
    parts:[
    { id:'a6p1', no:'(1)', q: String.raw`\(A(3)\)의 값을 구하고, 이 파형이 <b>기저선 아래쪽에 그려진다</b>는 것이 무엇을 뜻하는지 <b>읽기자료를 근거로</b> 1문장으로 쓸 것.`,
      fig:'ecg_A',
      type:'fields',
      fields:[{k:'v', label: String.raw`\(A(3)=\)`, ans:-1, tol:0, wrong:{'1': String.raw`1은 \(E(3)\)의 값이다. 바뀐 식 \((t-2)(t-4)\)에는 앞의 음의 부호가 없다. 다시 대입해 보자.`}}],
      write:{ lines:1, checklist:[String.raw`탈분극이 전극에서 멀어지는 방향으로 진행된다는 읽기자료의 설명을 근거로 썼다`, String.raw`P파가 심방의 탈분극을 나타낸다는 점과 연결하여, 심방의 탈분극이 정상과 다른 방향으로 전달되고 있다는 뜻을 담았다`, {t: String.raw`‘값이 음수다’, ‘아래에 있다’처럼 사실을 되풀이하는 데 그치지 않았다`, warn:true}] },
      hints:[{ref:'p2', t: String.raw`\((3-2)(3-4)\)를 계산하자. 그리고 읽기자료 둘째 문단에서 파형이 기저선 아래쪽으로 그려지는 경우가 무엇인지 찾자.`},
             {ref:'p3', t: String.raw`P파는 어느 부분의 탈분극인가(셋째 문단)? ‘그 부분의 탈분극이 전극에 대해 … 방향으로 진행된다’로 문장을 만들자.`}],
      model: String.raw`\((3-2)(3-4)=-1\). 파형이 기저선 아래쪽에 그려진다는 것은 그 순간 탈분극이 전극에서 멀어지는 방향으로 진행되고 있다는 뜻이다. 즉 심방의 탈분극이 정상과 다른 방향으로 전달되고 있다.` },
    { id:'a6p2', no:'(2)', q: String.raw`\(B(t)\)에서 QRS파가 차지하는 구간을 쓰고, 그 <b>구간의 길이</b>를 \(E(t)\)의 경우와 비교할 것. 또 \(t=4\)와 \(t=8\)에서 \(B(t)\)가 연속인지 확인할 것.`,
      fig:'ecg_B',
      type:'fields',
      tpl: String.raw`\(B(t)\)의 QRS파 구간: [s] \(\le t<\) [e] , 구간의 길이 [len] (\(E(t)\)의 QRS파 구간의 길이 [lenE] )`,
      fields:[{k:'s', label: String.raw`구간의 시작`, ans:4, tol:0},{k:'e', label: String.raw`구간의 끝`, ans:8, tol:0},
              {k:'len', label: String.raw`\(B(t)\)의 QRS파 길이`, ans:4, tol:0},{k:'lenE', label: String.raw`\(E(t)\)의 QRS파 길이`, ans:2, tol:0}],
      write:{ lines:3, checklist:[String.raw`\(B(t)\)의 QRS파 길이 4가 \(E(t)\)의 2보다 두 배 넓다고 비교했다`, String.raw`\(t=4\)에서 좌극한 \(-(4-2)(4-4)=0\), 우극한 \(-4+4=0\), 함숫값 0을 구해 연속임을 확인했다`, String.raw`\(t=8\)에서 좌극한 \(2\cdot8-16=0\), 우극한 \(-\frac14(8-8)(8-12)=0\), 함숫값 0을 구해 연속임을 확인했다`] },
      hints:[{ref:'f1', t: String.raw`\(B(t)\)에서 새로 정의된 네 줄의 구간을 이어 붙이면 QRS파의 구간이 된다. \(E(t)\)의 QRS파 구간은 읽기자료의 함수식에서 Q파가 시작되는 지점과 S파가 끝나는 지점을 찾아 확인하자.`},
             {t: String.raw`\(t=4\)의 왼쪽은 \(E(t)\)의 P파 식, 오른쪽은 \(-t+4\)이다. \(t=8\)의 왼쪽은 \(2t-16\), 오른쪽은 \(E(t)\)의 T파 식이다. 각각 좌극한·우극한·함숫값을 구해 비교하자.`}],
      // 원문 유지: 교사용 모범답안의 "E(t)의 [5, 7](길이 2)" 표기
      model: String.raw`\(B(t)\)의 QRS파는 \(4\le t<8\), 구간의 길이는 4로 \(E(t)\)의 \([5,7]\)(길이 2)보다 두 배 넓다. 연속 확인: \(\displaystyle\lim_{t\to4^-}=-(4-2)(4-4)=0\), \(\displaystyle\lim_{t\to4^+}=-4+4=0\), 값 0 / \(\displaystyle\lim_{t\to8^-}=2\cdot8-16=0\), \(\displaystyle\lim_{t\to8^+}=-\frac14(8-8)(8-12)=0\), 값 0. 두 지점 모두 세 값이 같으므로 연속이다. (최고 전위차는 4로 \(E(t)\)와 같다.)` },
    { id:'a6p3', no:'(3)', q: String.raw`\(A(t)\)와 \(B(t)\) <b>중 하나를 골라</b>, 그 심전도에서 심장의 전기 활동이 \(E(t)\)의 경우와 어떻게 다른지 <b>수학적 근거(값·구간·연속 등)와 읽기자료의 내용</b>을 함께 들어 2~3문장으로 쓸 것.`,
      type:'choices',
      // 어느 쪽을 골라도 정답. 단일 선택이므로 ans 에 A(t), allow 에 B(t)를 두어 둘 다 인정.
      groups:[{k:'c', label: String.raw`고른 함수`, opts:[String.raw`\(A(t)\)`, String.raw`\(B(t)\)`], ans:[String.raw`\(A(t)\)`], allow:[String.raw`\(B(t)\)`]}],
      write:{ lines:3, checklist:[String.raw`계산한 값·구간의 길이·연속 여부 중 <b>하나 이상</b>을 수학적 근거로 들었다`, String.raw`읽기자료의 내용(P파·QRS파의 의미, 전극의 방향, 탈분극에 걸리는 시간)과 연결했다`, String.raw`\(E(t)\)의 경우와 ‘어떻게 다른지’를 비교하여 썼다`, {t: String.raw`“비정상이다”, “심장이 아프다”처럼 근거 없는 단정에 그치지 않았다`, warn:true}] },
      hints:[{ref:'p3', t: String.raw`(1)에서 구한 \(A(3)\)의 부호, (2)에서 구한 \(B(t)\)의 구간 길이와 연속 여부가 수학적 근거다. 읽기자료 셋째 문단에서 P파·QRS파가 각각 무엇을 뜻하는지 찾자.`},
             {ref:'note', t: String.raw`\(B(t)\)를 골랐다면 ‘QRS파의 가로 폭 = 심실이 탈분극되는 데 걸리는 시간’과 참고 상자(끊김 없이 기록되면 장치 문제가 아님)를, \(A(t)\)를 골랐다면 ‘전극에서 멀어지는 방향’을 근거로 연결하자.`}],
      model: String.raw`예시(\(B(t)\)를 고른 경우) \(B(t)\)의 QRS파는 구간의 길이가 4로 \(E(t)\)의 2보다 두 배 넓지만 최고 전위차는 4로 같다. 읽기자료에서 QRS파는 심실의 탈분극을 나타내므로, 심실 전체가 탈분극되는 데 걸리는 시간이 \(E(t)\)의 경우보다 오래 걸리고 있음을 알 수 있다. 그런데도 접합점마다 좌극한·우극한·함숫값이 모두 같아 기록 자체는 끊김 없이 이어져 있으므로, 장치의 오류가 아니라 심장의 전기 활동이 느려진 것으로 볼 수 있다. / 예시(\(A(t)\)를 고른 경우) \(A(t)\)의 P파는 \(A(3)=-1\)과 부호만 반대이고, \(t=2,\ 4\)에서는 여전히 값이 0이어서 연속이다. P파는 심방의 탈분극을 나타내는데 파형이 기저선 아래에 그려졌으므로, 심방의 탈분극이 전극에서 멀어지는 방향, 즉 정상과 다른 방향으로 전달되고 있음을 알 수 있다. (정답이 하나가 아니다. 다른 관점이라도 계산한 값이나 구간을 근거로 삼고 읽기자료의 내용과 연결했다면 만점.)` }
  ]}
  ],
  criteria: {

      write:{ lines:1, checklist:[String.raw`\(v(4000)\lt v(1000)\), 즉 더 깊은 곳인데도 속도가 더 느리다는 <b>두 값의 비교</b>를 썼다`, String.raw`‘깊어질수록 속도가 늘어나기만 하는 것은 아니다’는 결론을 썼다`, {t: String.raw`두 값을 비교하지 않고 ‘깊을수록 빨라진다’고만 쓰지 않았다`, warn:true}] },
      hints:[{ref:'fig1', t: String.raw`가로축 1000과 4000에서 위로 올라가 빨간 P파 곡선과 만나는 높이를 세로 눈금(3, 6, 9, 12, 15)으로 어림해 보자. 1000은 맨틀, 4000은 외핵에 있다.`},
             {t: String.raw`1000에서는 곡선이 12 눈금 조금 아래, 4000에서는 9 눈금 조금 위다. 더 깊은 4000에서 속도가 더 크던가, 작던가?`}],
      model: String.raw`\(v(1000)\approx 11.4\), \(v(4000)\approx 9.5\). 더 깊은 곳인데도 속도가 더 느리므로, 깊어질수록 속도가 늘어나기만 하는 것은 아니다. (두 값은 ±0.5 이내면 정답)` },
    { id:'a2p3', no:'(3)', q: String.raw`그래프에서 S파의 곡선은 어디까지 그려져 있는가? \(s(x)\)의 <b>정의역</b>을 부등식으로 쓸 것.`,
      type:'fields',
      fields:[{k:'lo', label: String.raw`정의역의 시작`, ans:0, tol:0},
              {k:'hi', label: String.raw`정의역의 끝`, ans:2900, tol:0, wrong:{'6400': String.raw`S파의 파란 곡선이 6400까지 그려져 있는가? 곡선이 어디에서 ○로 끝나는지 다시 보자.`, '5100': String.raw`5100은 P파의 레만 불연속면이다. 파란 S파 곡선은 어디에서 끝나는가?`}}],
      write:{ lines:1, checklist:[String.raw`S파의 곡선이 \(x=2900\) 직전까지만 그려져 있다는 그래프의 근거를 썼다`, String.raw`정의역을 \(0\le x<2900\)처럼 부등식으로 썼다`, String.raw`끝점 2900이 ○이므로 \(x<2900\)(2900을 포함하지 않음)으로 썼다`] },
      hints:[{ref:'fig1', t: String.raw`파란 S파 곡선을 왼쪽 끝에서 오른쪽으로 따라가 보자. 어디에서 끝나며, 그 끝은 ●인가 ○인가?`},
             {t: String.raw`곡선이 그려진 \(x\)의 범위가 정의역이다. 끝이 ○이면 그 값은 포함되지 않으므로 부등호에 등호를 붙이지 않는다.`}],
      model: String.raw`S파의 곡선은 \(x=2900\) 직전까지만 그려져 있다. 정의역은 \(0\le x<2900\)이다.` }
  ]},
  { id:'a3', area:'Ⅱ', title: String.raw`활동 3`,
    lead: String.raw`모호로비치치가 발견한 깊이 \(x=50\) 부근을 자세히 살펴보자. &lt;그림 1&gt;의 <b>확대 그림</b>을 이용한다.`,
    parts:[
    { id:'a3p1', no:'(1)', q: String.raw`그래프를 읽어 \(\displaystyle\lim_{x\to 50^-} v(x)\), \(\displaystyle\lim_{x\to 50^+} v(x)\), \(v(50)\)의 값을 각각 쓸 것. (●와 ○의 뜻에 주의할 것)`,
      fig:'quake_v_inset',
      type:'fields',
      fields:[{k:'l', label: String.raw`\(\displaystyle\lim_{x\to 50^-} v(x)=\)`, ans:6, tol:0.05, wrong:{'8': String.raw`50보다 왼쪽(얕은 쪽)에서 다가갈 때 빨간 선은 어느 높이에 있는가? 확대 그림의 세로 눈금을 보자.`, '3.5': String.raw`3.5는 파란 S파의 값이다. 묻는 것은 P파 \(v(x)\)다.`}},
              {k:'r', label: String.raw`\(\displaystyle\lim_{x\to 50^+} v(x)=\)`, ans:8, tol:0.05, wrong:{'6': String.raw`50보다 오른쪽(깊은 쪽)에서 다가갈 때 빨간 선은 어디에서 출발하는가?`, '4.5': String.raw`4.5는 파란 S파의 값이다. 묻는 것은 P파 \(v(x)\)다.`}},
              {k:'v', label: String.raw`\(v(50)=\)`, ans:8, tol:0.05, wrong:{'6': String.raw`확대 그림에서 \(x=50\)의 아래쪽 점(6)은 ○이다. ○는 ‘그 점의 값이 아님’을 뜻한다. 그렇다면 \(x=50\)에서의 값은 어느 점일까?`}}],
      hints:[{ref:'fig1b', t: String.raw`확대 그림에서 \(x=50\)의 빨간 점선 위에 점이 두 개 있다. ●와 ○의 뜻을 &lt;그림 1&gt; 캡션에서 확인하자.`},
             {t: String.raw`50 바로 왼쪽에서 빨간 선은 ○(6)로 다가가고, 오른쪽에서는 ●(8)에서 출발한다. 함숫값은 ●의 값이다.`}],
      model: String.raw`\(\displaystyle\lim_{x\to 50^-} v(x)=6\), \(\displaystyle\lim_{x\to 50^+} v(x)=8\), \(v(50)=8\). 확대 그림에서 \(x=50\)의 아래쪽 점은 ○(값이 아님), 위쪽 점은 ●(값임)이므로 함숫값은 8이다.` },
    { id:'a3p2', no:'(2)', q: String.raw`\(\displaystyle\lim_{x\to 50} v(x)\)가 존재하는지 판단하고, \(x=50\)에서 \(v(x)\)가 연속인지 쓸 것. 또 연속의 세 조건 중 <b>어떤 것이 성립하지 않는지</b> 밝힐 것.`,
      type:'choices',
      groups:[
        {k:'e', label: String.raw`\(\displaystyle\lim_{x\to 50} v(x)\)가 존재하는가?`, opts:['존재한다','존재하지 않는다'], ans:['존재하지 않는다'], allow:[], multi:false, fb:{'존재한다': String.raw`좌극한과 우극한이 같아야 극한값이 존재한다. (1)에서 읽은 두 값은 같은가?`}},
        {k:'c', label: String.raw`\(v(x)\)는 \(x=50\)에서`, opts:['연속이다','불연속이다'], ans:['불연속이다'], allow:[], multi:false, fb:{'연속이다': String.raw`확대 그림에서 \(x=50\)의 빨간 선이 이어져 있는지 다시 보자.`}},
        {k:'w', label: String.raw`성립하지 않는 조건`, opts:['함숫값이 정의된다','극한값이 존재한다','극한값과 함숫값이 같다'], ans:['극한값이 존재한다'], allow:[], multi:false,
         fb:{'함숫값이 정의된다': String.raw`\(v(50)\)은 ●로 8이라고 정의되어 있다. 정의되지 않은 것이 아니라 다른 조건이 깨졌다.`, '극한값과 함숫값이 같다': String.raw`두 값을 비교하려면 극한값이 먼저 있어야 한다. 가장 먼저 깨진 조건은 무엇일까?`}}],
      write:{ lines:1, checklist:[String.raw`‘좌극한 6과 우극한 8이 다르므로’를 판단의 근거로 썼다`, String.raw`연속의 세 조건 중 <b>극한값의 존재</b>가 성립하지 않는다고 밝혔다`, {t: String.raw`‘\(v(50)\)이 정의되지 않아서’라고 쓰지 않았다 (\(v(50)=8\)로 정의는 되어 있다)`, warn:true}] },
      hints:[{ref:'fig1b', t: String.raw`좌극한과 우극한이 같아야 극한값이 존재한다. (1)에서 읽은 두 값을 비교해 보자.`},
             {t: String.raw`연속의 세 조건은 ① 함숫값이 정의됨 ② 극한값이 존재함 ③ 극한값 = 함숫값이다. 함숫값은 ●로 8이라고 정의되어 있으니 ①은 성립한다.`}],
      model: String.raw`좌극한 6과 우극한 8이 서로 다르므로 \(\displaystyle\lim_{x\to 50} v(x)\)가 존재하지 않는다. 연속의 세 조건 중 극한값의 존재가 성립하지 않으므로 \(x=50\)에서 불연속이다.` },
    { id:'a3p3', no:'(3)', q: String.raw`지구과학에서는 이 지점을 ‘<b>불연속</b>면’이라 부른다. 그 이름이 수학에서의 ‘불연속’과 어떻게 연결되는지 <b>읽은 두 값을 근거로</b> 2문장 이내로 쓸 것.`,
      type:'none',
      write:{ lines:2, checklist:[String.raw`읽은 두 값 6과 8을 근거로 제시했다`, String.raw`50 km에 가까워질 때 위쪽에서는 6에, 아래쪽에서는 8에 가까워져 값이 이어지지 않는다(불연속)고 썼다`, String.raw`함수의 불연속이라는 수학적 사실을 ‘그 깊이를 경계로 물질이 달라진다’는 지구과학의 결론과 연결했다`] },
      hints:[{ref:'p2', t: String.raw`읽기자료 둘째 문단을 보자. 지구과학에서 ‘불연속면’은 어떤 곳을 가리키는 이름인가?`},
             {t: String.raw`(1)에서 읽은 6과 8을 먼저 쓰고, ‘값이 이어지지 않는다 = 함수가 불연속이다’와 ‘물질이 달라지는 경계’를 한 문장으로 이어 보자.`}],
      model: String.raw`깊이가 50 km에 가까워질 때 위쪽에서는 속도가 6에, 아래쪽에서는 8에 가까워져 값이 이어지지 않는다. 함수가 그 점에서 불연속이라는 수학적 사실이, 그 깊이를 경계로 물질이 달라진다는 지구과학의 결론과 같은 내용을 가리키므로 ‘불연속면’이라 부른다.` }
  ]},
  { id:'a4', area:'Ⅱ', title: String.raw`활동 4`,
    lead: String.raw`나머지 두 불연속면도 같은 방법으로 읽고 세 곳을 서로 비교해 보자.`,
    parts:[
    { id:'a4p1', no:'(1)', q: String.raw`아래 표의 좌극한과 우극한을 그래프에서 읽어 채울 것.`,
      type:'grid', head: String.raw`불연속면`,
      cols:[String.raw`모호로비치치 \(x=50\)`, String.raw`구텐베르크 \(x=2900\)`, String.raw`레만 \(x=5100\)`],
      rows:[{label: String.raw`좌극한`, ans:[6,13.7,10.2], tol:0.05},{label: String.raw`우극한`, ans:[8,8.0,11.2], tol:0.05}],
      hints:[{ref:'fig1', t: String.raw`\(x=2900\)과 \(x=5100\)의 빨간 점선 위에서 P파의 ○와 ● 옆에 적힌 숫자를 찾자. ○ 쪽이 왼쪽에서 다가간 값(좌극한), ● 쪽이 오른쪽에서 출발하는 값(우극한)이다. \(x=50\)은 활동 3-(1)에서 읽었다.`},
             {t: String.raw`2900에서는 위쪽 ○ 옆의 13.7이 좌극한, 아래쪽 ● 옆의 8.0이 우극한이다(파란 7.3은 S파의 값이니 섞지 말자). 5100에서도 같은 방법으로 읽자.`}],
      model: String.raw`좌극한 6, 13.7, 10.2 / 우극한 8, 8.0, 11.2. 즉 \(\displaystyle\lim_{x\to 2900^-} v(x)=13.7\), \(\displaystyle\lim_{x\to 2900^+} v(x)=8.0\), \(\displaystyle\lim_{x\to 5100^-} v(x)=10.2\), \(\displaystyle\lim_{x\to 5100^+} v(x)=11.2\)` },
    { id:'a4p2', no:'(2)', q: String.raw`세 곳에서 속도가 <b>갑자기 늘어나는지 줄어드는지</b>와 <b>변화의 폭</b>을 표에 정리할 것.`,
      type:'grid', head: String.raw`불연속면`,
      cols:[String.raw`모호로비치치 \(x=50\)`, String.raw`구텐베르크 \(x=2900\)`, String.raw`레만 \(x=5100\)`],
      rows:[{label: String.raw`증가 / 감소`, opts:['증가','감소'], ans:['증가','감소','증가']},
            {label: String.raw`변화의 폭`, ans:[2,5.7,1.0], tol:0.05, absOk:true}],
      hints:[{t: String.raw`(1)의 표에서 (우극한)과 (좌극한)을 비교하자. 우극한이 더 크면 깊어지는 순간 속도가 ‘증가’, 더 작으면 ‘감소’다.`},
             {t: String.raw`변화의 폭은 두 값의 차이다. \(x=50\)에서는 \(8-6=2\). 2900에서는 \(13.7\)과 \(8.0\)의 차, 5100에서는 \(11.2\)와 \(10.2\)의 차를 구하자. (−5.7처럼 부호를 붙여 써도 인정된다.)`}],
      model: String.raw`증가 / 감소: 증가, <b>감소</b>, 증가 / 변화의 폭: 2, 5.7, 1.0 (변화의 폭을 절댓값이 아닌 부호 포함 −5.7로 쓴 답도 인정)` },
    { id:'a4p3', no:'(3)', q: String.raw`변화의 폭이 가장 큰 곳은 어디인가? 또 세 곳 중 <b>유일하게 다른 방향으로</b> 변하는 곳을 찾아 쓰고, 그것이 무엇을 뜻할지 <b>1문장</b>으로 추측하여 쓸 것.`,
      type:'choices',
      groups:[
        {k:'big', label: String.raw`변화의 폭이 가장 큰 곳`, opts:[String.raw`모호로비치치 \(x=50\)`, String.raw`구텐베르크 \(x=2900\)`, String.raw`레만 \(x=5100\)`], ans:[String.raw`구텐베르크 \(x=2900\)`], allow:[], multi:false,
         fb:{[String.raw`모호로비치치 \(x=50\)`]: String.raw`(2)의 표에서 변화의 폭 세 값(2, 5.7, 1.0)을 다시 비교해 보자.`, [String.raw`레만 \(x=5100\)`]: String.raw`(2)의 표에서 변화의 폭 세 값(2, 5.7, 1.0)을 다시 비교해 보자.`}},
        {k:'dir', label: String.raw`유일하게 다른 방향으로 변하는 곳`, opts:[String.raw`모호로비치치 \(x=50\)`, String.raw`구텐베르크 \(x=2900\)`, String.raw`레만 \(x=5100\)`], ans:[String.raw`구텐베르크 \(x=2900\)`], allow:[], multi:false,
         fb:{[String.raw`모호로비치치 \(x=50\)`]: String.raw`(2)의 ‘증가 / 감소’ 행을 보자. 셋 중 하나만 다른 것은 어느 곳인가?`, [String.raw`레만 \(x=5100\)`]: String.raw`(2)의 ‘증가 / 감소’ 행을 보자. 셋 중 하나만 다른 것은 어느 곳인가?`}}],
      write:{ lines:1, checklist:[String.raw`구텐베르크 불연속면(\(x=2900\))에서만 속도가 <b>줄어든다</b>는 점을 근거로 썼다`, String.raw`그 아래의 물질이 위와 성질이 크게 다르다(무르거나 액체일 수 있다 등)는 방향의 추측을 썼다`, String.raw`추측을 읽은 값(13.7 → 8.0, 폭 5.7)과 연결하여 썼다`] },
      hints:[{t: String.raw`(2)의 표를 보자. 변화의 폭이 가장 큰 값은 어느 열에 있고, ‘증가 / 감소’ 행에서 혼자 다른 것은 어느 열인가?`},
             {ref:'p1', t: String.raw`읽기자료 첫째 문단에서 지진파의 속도는 무엇에 따라 달라진다고 했는가? 속도가 갑자기 크게 줄었다면 그 아래의 물질은 어떨 것이라고 추측할 수 있을까?`}],
      model: String.raw`변화의 폭이 가장 큰 곳은 구텐베르크 불연속면(\(x=2900\))이며, 세 곳 중 유일하게 속도가 줄어든다. 이는 그 아래의 물질이 위와 성질이 크게 다르다는 뜻으로 추측할 수 있다. (추측은 “물질이 크게 다르다/무르거나 액체일 수 있다” 등 방향만 맞으면 인정)` }
  ]},
  { id:'a5', area:'Ⅲ', title: String.raw`활동 5`,
    lead: String.raw`이번에는 S파를 살펴보자. P파와 달리 S파의 그래프는 \(x=2900\)에서 <b>끝나 버린다.</b>`,
    parts:[
    { id:'a5p1', no:'(1)', q: String.raw`그래프를 읽어 \(\displaystyle\lim_{x\to 2900^-} s(x)\)의 값을 쓸 것.`,
      type:'fields',
      fields:[{k:'l', label: String.raw`\(\displaystyle\lim_{x\to 2900^-} s(x)=\)`, ans:7.3, tol:0.05, wrong:{'8': String.raw`8.0은 빨간 P파 ●의 값이다. 파란 S파 곡선 끝의 ○ 옆에 파란 글씨로 적힌 값을 찾아보자.`, '13.7': String.raw`13.7은 P파의 값이다. 묻는 것은 S파 \(s(x)\)다. 파란 곡선의 끝을 보자.`}}],
      hints:[{ref:'fig1', t: String.raw`파란 S파 곡선이 \(x=2900\)에서 ○로 끝난다. 그 ○ 옆에 파란 글씨로 적힌 값이 왼쪽에서 다가간 값이다.`},

  reading: String.raw`<div class="reading">
 <p data-ref="p1">1885년 독일의 심리학자 <b>에빙하우스</b>는 사람이 배운 것을 시간이 지나면서 얼마나 잊는지를 처음으로 <b>수치로</b> 측정하였다. 그는 이미 아는 뜻이 영향을 주지 않도록 ‘ZOF’, ‘KAG’처럼 아무 뜻이 없는 낱말을 외운 뒤, 시간이 지난 다음 <b>그것을 다시 외우는 데 걸리는 시간</b>을 쟀다. 이때 사용한 값이 <b>파지율</b>이다.</p>
 <div class="formula" data-ref="f1">\[(\text{파지율})=\frac{(\text{처음 학습에 걸린 시간})-(\text{다시 외우는 데 걸린 시간})}{(\text{처음 학습에 걸린 시간})}\times 100\ (\%)\]</div>
 <p data-ref="p2">처음과 똑같은 시간이 걸렸다면 파지율은 0 %이고, 전혀 잊지 않아 시간이 들지 않았다면 100 %이다. <b>파지율이 클수록 기억이 많이 남아 있다는 뜻이다.</b></p>
 <p data-ref="p3">측정 결과 파지율은 학습 후 <b>10분 무렵부터 떨어지기 시작</b>하여, 1시간 뒤에는 절반 가까이, 하루 뒤에는 70 % 이상, 한 달 뒤에는 80 % 가까이 잊어버리는 것으로 나타났다. 잊는 속도는 <b>처음에 가장 빠르고 시간이 지날수록 느려지지만</b>, 복습하지 않으면 <b>멈추지 않고 계속 줄어든다.</b></p>
 <p data-ref="p4">에빙하우스는 해답도 함께 찾아냈다. 바로 <b>복습</b>이다. 복습을 하면 파지율이 <b>다시 100 %로 올라가고</b>, 그 뒤로는 <b>곡선이 이전보다 완만해져</b> 잊는 속도가 느려진다. 그래서 학습 후 <b>10분 · 1일 · 1주일 · 1달</b>의 네 시점에 복습하기를 권한다. 이때가 <b>기억이 아슬아슬하게 사라지기 직전</b>이기 때문이다.</p>
 <figure data-ref="fig1" data-fig="forget_1"><figcaption>&lt;그림 1&gt; 복습을 하지 않았을 때의 파지율 \(f(t)\)<br>※ 가로축은 10분·1시간·1일·1주·1달의 간격을 고르게 나타낸 눈금이다.</figcaption></figure>
 <p class="src" data-ref="src">출처: 에빙하우스의 망각 곡선 자료를 바탕으로 재구성</p>
 <p data-ref="p5"><b>&lt;그림 2&gt;</b>는 <b>1시간 · 1일 · 1주 · 1달</b>의 네 시점에 복습했을 때의 파지율 \(g(t)\)(%)이다. 비교를 위해 복습하지 않은 &lt;그림 1&gt;의 곡선을 옅은 점선으로 함께 나타내었다.</p>
 <figure data-ref="fig2" data-fig="forget_2"><figcaption>&lt;그림 2&gt; 복습을 네 번 했을 때의 파지율 | ●는 그 점에서의 값, ○는 <b>그 점의 값이 아님</b>을 뜻한다.<br>※ 가로축 눈금은 &lt;그림 1&gt;과 같다.</figcaption></figure>
</div>`,

/* ---------- number parsing ---------- */
function normNum(s){
  return String(s??'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[−–—]/g,'-').replace(/[／⁄∕]/g,'/').replace(/[．]/g,'.')
    .replace(/[,%]/g,'').replace(/＝/g,'=').replace(/\s+/g,' ').trim();
}
/* LaTeX -> 읽을 수 있는 평문 (안내 문장·aria-label 용) */
function plain(s){
  let t=String(s??'');
  t=t.replace(/\\[()[\]]/g,' ').replace(/\$+/g,' ');
  t=t.replace(/\\(?:displaystyle|limits|left|right|quad|qquad|text|mathrm)\b/g,' ').replace(/\\[!,;:\s]/g,'');
  t=t.replace(/\\d?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,'$1/$2').replace(/\\dfrac12/g,'1/2');
  t=t.replace(/\\lim_?\{?([^{}]*)\}?/g,(m,a)=>'lim('+a.replace(/\\to/g,'→')+')');
  t=t.replace(/\\to/g,'→').replace(/\\infty/g,'∞').replace(/\\le\b/g,'≤').replace(/\\ge\b/g,'≥').replace(/\\times/g,'×').replace(/\\cdot/g,'·').replace(/\\pm/g,'±').replace(/\\sqrt/g,'√').replace(/\\theta/g,'θ').replace(/\\lt\b/g,'<').replace(/\\gt\b/g,'>');
  t=t.replace(/\^\{?([^{}\s]*)\}?/g,'$1').replace(/_\{?([^{}\s]*)\}?/g,'$1');
  t=t.replace(/\\[a-zA-Z]+/g,' ').replace(/[{}]/g,'').replace(/<[^>]+>/g,'');
  return t.replace(/\s+/g,' ').trim();
}
function numVal(s,fd){
  let t=normNum(s);
  if(fd&&fd.alias) for(const a in fd.alias){ if(normNum(a)&&normNum(a)===t) return ansVal(fd.alias[a]); }
  if(fd&&fd.strip) for(const pre of fd.strip){const p=normNum(pre); if(p&&t.toLowerCase().startsWith(p.toLowerCase())) t=t.slice(p.length);}
  if(t==='') return NaN;
  // 대분수: 1 1/4 → 1.25 (음수면 1 1/4 전체에 부호)
  let m=t.match(/^([-+]?)(\d+)\s+(\d+)\/(\d+)$/);
  if(m){ const d=Number(m[4]); if(!d) return NaN;
    const v=Number(m[2])+Number(m[3])/d; return m[1]==='-'?-v:v; }

function xmlSafe(t){ return t.replace(/&nbsp;/g,'&#160;')

/* 카드를 그림 한 장으로 — 인쇄가 막힌 휴대폰 브라우저를 위한 길 */
function cardImage(cb){
  const card=document.getElementById('mycard'); if(!card) return cb(null);
  const W=Math.ceil(card.getBoundingClientRect().width), H=Math.ceil(card.scrollHeight);
  const body='<style>'+exportCSS()+'\n.myp-go{display:none!important}</style>'+xmlSafe(card.outerHTML);
  // data-theme="light"를 붙여 어두운 화면에서도 밝은 색으로 내보낸다
  const svg='<svg xmlns="http://www.w3.org/2000/svg" data-theme="light" width="'+W+'" height="'+H+'">'
    +'<foreignObject x="0" y="0" width="'+W+'" height="'+H+'">'
    +'<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+W+'px;background:#fff">'+body+'</div>'
    +'</foreignObject></svg>';
  const im=new Image();
  im.onload=()=>{ try{
      const cv=document.createElement('canvas'); cv.width=W*2; cv.height=H*2;
      const g=cv.getContext('2d'); g.scale(2,2); g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.drawImage(im,0,0);
      if(cv.toBlob) cv.toBlob(bl=>cb(bl?URL.createObjectURL(bl):cv.toDataURL('image/png')),'image/png');
      else cb(cv.toDataURL('image/png'));
    }catch(e){ cb(null); } };
  im.onerror=()=>cb(null);
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function readDoc(){ if(_readFor!==ui.topic){ _readDoc=document.createElement('div'); _readDoc.innerHTML=T().reading; _readFor=ui.topic; } return _readDoc; }
function brief(p){
  const refs=[...new Set((p.hints||[]).map(h=>h.ref).filter(Boolean))];
  if(!refs.length) return '';
  const doc=readDoc(); const bits=[];
  refs.forEach(r=>{ const el=doc.querySelector(`[data-ref="${r}"]`); if(!el) return;
    if(el.tagName==='FIGURE'){ const name=el.dataset.fig; if(!name||!FIGS[name]) return;
      const cap=el.querySelector('figcaption'); bits.push(`<figure data-fig="${name}">${cap?cap.outerHTML:''}</figure>`); }
    else if(el.classList&&el.classList.contains('formula')) bits.push(el.outerHTML);
  });
  if(!bits.length) return '';
  const label=(bits.length===1&&bits[0].indexOf('<figure')===0)?'이 문항에 필요한 그래프':'이 문항에 필요한 자료';
  return `<details class="brief"><summary>${label}</summary><div class="brief-in">${bits.join('')}</div></details>`;
}

/* ---------- grading ---------- */
function grade(p){
  const s=ps(p.id), f={}, msgs=[], sel={}; let miss=0;
  if(p.type==='grid'){
    p.rows.forEach((row,i)=>p.cols.forEach((c,j)=>{const k=`${i}_${j}`;const ok=row.opts?s.v[k]===row.ans[j]:checkNum(s.v[k],row.ans[j],row.tol,row);f[k]=ok;if(!ok)miss++;}));
    if(miss) msgs.push(`${miss}개 칸의 값을 자료에서 다시 읽어 보자. 틀린 칸은 테두리가 굵고 붉게 표시된다.`);
  } else if(p.type==='fields'){
    p.fields.forEach(fd=>{const ok=checkNum(s.v[fd.k],fd.ans,fd.tol,fd);f[fd.k]=ok;
      if(!ok){miss++; const w=wrongMsg(s.v[fd.k],fd); if(w) msgs.push(w); else if(String(s.v[fd.k]??'').trim()==='') msgs.push(`‘${plain(fd.label)}’ 칸이 비어 있다.`);}});
  } else if(p.type==='choices'){
    p.groups.forEach(g=>{
      const okSet=new Set([...(g.ans||[]),...(g.allow||[])]);
      if(g.multi){
        const v=Array.isArray(s.v[g.k])?s.v[g.k]:[]; sel[g.k]={};
        let ok=v.length>0, missingReq=false; (g.ans||[]).forEach(a=>{if(!v.includes(a)){ok=false; missingReq=true;}});
        v.forEach(o=>{const good=okSet.has(o); sel[g.k][o]=good; if(!good){ok=false; if(g.fb&&g.fb[o]) msgs.push(g.fb[o]);}});
        if(missingReq) v.forEach(o=>{if(okSet.has(o)&&!(g.ans||[]).includes(o)&&g.fb&&g.fb[o]) msgs.push(g.fb[o]);});
        f[g.k]=ok; if(!ok){miss++; if(!v.length) msgs.push(`‘${plain(g.label)}’에서 아직 고르지 않았다.`); else if(!msgs.length) msgs.push(`‘${plain(g.label)}’에 빠진 것이 있거나 맞지 않는 것이 섞여 있다.`);}
      } else {
        const v=s.v[g.k]; const ok=!!v&&okSet.has(v); f[g.k]=ok;
        if(!ok){miss++; if(!v) msgs.push(`‘${plain(g.label)}’에서 아직 고르지 않았다.`); else if(g.fb&&g.fb[v]) msgs.push(g.fb[v]);}
      }});
  }
  const uniq=[...new Set(msgs)];
  return {ok:miss===0,f,miss,msgs:uniq.slice(0,3),more:Math.max(0,uniq.length-3),sel};
}

/* ---------- report ---------- */
const reqOk=([k,id,idx])=>{const p=partById(id); if(!p) return false; const s=ps(id); if(k==='a') return !!(s.res&&s.res.ok);
  if(!p.write||!s.sub) return false; const list=Array.isArray(idx)?idx:p.write.checklist.map((_,i)=>i); return list.every(i=>s.checks[i]);};
function critMet(c){ return c.any?c.req.some(reqOk):c.req.every(reqOk); }
/* 자동 채점으로 확인되는 부분과 학생이 스스로 체크한 부분을 나눈다.
   서술은 자기 신고이므로 점수에 넣지 않는다. */
function critSplit(c){
  const A=c.req.filter(r=>r[0]==='a'), S=c.req.filter(r=>r[0]==='s');
  const f=list=>!list.length?null:(c.any?list.some(reqOk):list.every(reqOk));
  return {auto:f(A), self:f(S)};
}
function autoStats(t){
  let ok=0,n=0; allParts(t).forEach(p=>{ if(hasAuto(p)){n++; const s=ps(p.id); if(s.res&&s.res.ok) ok++;} });
  return {ok,n};
}
function reportHTML(){
  const t=T();
  const started=allParts(t).some(p=>{const s=ps(p.id); return s.tried||s.sub;});
  const A=autoStats(t);
  const cards=Object.keys(t.criteria).map(ar=>{
    const cs=t.criteria[ar];
    const autoList=cs.map(critSplit).filter(x=>x.auto!==null);
    const autoMet=autoList.filter(x=>x.auto).length;
    const hintN=t.acts.filter(a=>a.area===ar).flatMap(a=>a.parts).reduce((n,p)=>n+ps(p.id).hint,0);
    return `<section class="acard"><div class="acard-h"><h2>영역 ${ar} · ${t.areas[ar]}</h2><span>${autoMet}/${autoList.length}</span></div>
      ${cs.map(c=>{const x=critSplit(c);
        const bits=[];
        if(x.auto!==null) bits.push(`<span class="tag ${x.auto?'y':'n'}">채점 ${x.auto?'충족':'미충족'}</span>`);
        if(x.self!==null) bits.push(`<span class="tag ${x.self?'s':'n'}">서술 ${x.self?'스스로 확인함':'미확인'}</span>`);
        const m=x.auto===null?x.self:(x.self===null?x.auto:(x.auto&&x.self));
        return `<div class="crit"><span class="mk ${m?'y':'n'}" aria-label="${m?'충족':'미충족'}">${m?'●':'○'}</span><span>${c.n} ${c.t}<small>${c.w}</small><span class="tags">${bits.join('')}</span></span></div>`}).join('')}
      <p class="meta">이 영역에서 연 힌트 ${hintN}개</p></section>`;
  }).join('');
  const st=ts();
  return `<main class="report wrap">
    <div style="display:grid;gap:8px"><div class="eyebrow">점검 결과</div><h1>영역별로 어디까지 왔을까</h1>
    ${started?`<div class="score"><strong>${A.ok}</strong><span>/ ${A.n} 문항 · 자동 채점</span></div>
      <div class="bar-meter"><i style="width:${A.n?Math.round(A.ok/A.n*100):0}%"></i></div>`
     :'<p class="disc">아직 푼 문항이 없다. 활동을 풀면 여기에 결과가 나타난다.</p>'}
    <p class="disc">숫자·선택 문항만 자동으로 채점했다. <b>서술 문항은 스스로 체크한 것이라 점수에 넣지 않았다.</b> 체크리스트는 내 답에 무엇이 빠졌는지 확인하는 용도이고, 실제 점수는 선생님이 답안을 읽고 매긴다.</p></div>
    <div class="areas">${cards}</div>
    ${t.reflect?`<section class="acard refl"><h2 style="font-size:16px">정리 활동</h2>${t.reflectLead?`<p class="disc">${t.reflectLead}</p>`:''}
      ${t.reflect.map(([k,v],i)=>`<label><input type="checkbox" data-act="refl" data-i="${i}" ${st.refl[i]?'checked':''}><span><b>${k}</b> — ${v}</span></label>`).join('')}
      <textarea id="refl__text" data-act="refl-text" placeholder="서술" aria-label="정리 활동 서술">${esc(st.reflText)}</textarea></section>`:''}
    ${t.checkBefore?`<section class="acard"><h2 style="font-size:16px">제출 전 확인</h2><ul class="checklist">${t.checkBefore.map(c=>`<li>${c}</li>`).join('')}</ul></section>`:''}
    ${(()=>{const left=[];
      t.acts.forEach((a,i)=>a.parts.forEach(p=>{const st=ps(p.id);
        if(done(p,st)) return;
        const why=[]; if(hasAuto(p)&&!(st.res&&st.res.ok)) why.push(st.res?'값 다시':'값');
        if(p.write&&!st.sub) why.push('서술');
        left.push({i,p,why:why.join(' · ')+' 남음'});}));
      if(!left.length) return `<section class="acard card-cta"><h2 style="font-size:16px">내 정리 카드</h2>
        <p class="disc">내가 쓴 답을 한 장으로 모아 준다. 캡처해 두고 평가 직전에 다시 볼 수 있다.</p>

      return `<section class="acard card-cta"><h2 style="font-size:16px">내 정리 카드</h2>
        <p class="disc">문항을 모두 해결하면 내가 쓴 답을 한 장으로 모아 준다. <b>남은 문항 ${left.length}개</b>를 눌러 바로 갈 수 있다.</p>
        <ul class="todo">${left.map(x=>`<li><button data-act="goto" data-i="${x.i}" data-part="${x.p.id}">
          <span class="td-a">${t.acts[x.i].title}</span><span class="td-n">${x.p.no||''}</span>
          <span class="td-w">${x.why}</span><span class="td-go">→</span></button></li>`).join('')}</ul>
        <button class="btn" disabled>내 정리 카드 열기</button></section>`;})()}
    <div class="cta-row"><button class="btn" data-act="go" data-i="0">활동 1부터 다시 보기</button><button class="btn ghost" data-act="reset">이 주제 기록 지우기</button></div>
  </main>`;
}

    case 'go': {const i=+b.dataset.i; if(i<0) return; ui.act=i; ui.screen='act'; ts().last=i; save(); render(); break;}
    case 'report': ui.screen='report'; render(); break;
    case 'card': ui.screen='card'; render(); break;
    case 'goto': {ui.act=+b.dataset.i; ui.screen='act'; ui.goto=b.dataset.part; ts().last=ui.act; save(); render(); break;}
    case 'print-card': {
      let w=null; try{w=window.open('','_blank');}catch(e){}
      if(w&&w.document){ try{ w.document.open(); w.document.write(printDoc()); w.document.close();
          setTimeout(()=>{try{w.focus(); if(typeof w.print==='function') w.print();}catch(e){}},800);
        }catch(e){ w=null; } }
      if(!w && window.self===window.top && typeof window.print==='function'){ try{window.print();}catch(e){} }
      {const n=document.getElementById('print-tip'); if(n){ n.hidden=false; say('인쇄용 페이지를 열었다. 열리지 않으면 아래 안내를 보자.'); }}
      break;}
    case 'img-card': {
      b.textContent='만드는 중…'; b.disabled=true;
      cardImage(url=>{ b.disabled=false; b.textContent='이미지로 저장';
        const out=document.getElementById('img-out');
        if(!url){ const n=document.getElementById('print-tip'); if(n) n.hidden=false;
          say('이미지를 만들지 못했다. 화면을 캡처하자.'); return; }
        out.innerHTML='<p class="disc">아래 그림을 <b>꾹 눌러</b> “이미지 저장”을 고르면 사진첩에 들어간다. 저장이 자동으로 됐다면 그대로 두면 된다.</p>'
          +'<img src="'+url+'" alt="내 정리 카드를 한 장으로 담은 그림">';
        out.hidden=false;
        const a=document.createElement('a'); a.href=url; a.download='내_정리_카드.png';
        document.body.appendChild(a); try{a.click();}catch(e){} a.remove();
        out.scrollIntoView({block:'start',behavior:'smooth'});
        say('이미지를 만들었다. 꾹 눌러 저장하자.'); });
      break;}
    case 'copy-card': {const txt=cardText();
      const done2=()=>{b.textContent='복사했다'; setTimeout(()=>{if(b.isConnected)b.textContent='카드 내용 복사';},2000);};
      try{ navigator.clipboard.writeText(txt).then(done2,()=>{selectCard();}); }catch(e){ selectCard(); }
      break;}
    case 'check': {const p=partById(id),s=ps(id); s.needWrite=false;
      if(hasAuto(p)){ s.res=grade(p); s.tried=true; }
      if(p.write){ const txt=String(s.v.text||'').trim();
        if(s.note||txt.length>=2){ s.sub=true; s.tried=true; }
        else { s.needWrite=true; const ta=document.getElementById(id+'__text'); if(ta) ta.focus(); } }
      save(); rerenderPart(id);
      {const msgs=[];
       if(hasAuto(p)) msgs.push(s.res.ok?'정답입니다.':`${s.res.miss}곳이 틀렸습니다. ${s.res.msgs.join(' ')}`);
       if(p.write&&s.needWrite) msgs.push('서술을 쓰면 자기점검이 열립니다.');
       else if(p.write&&s.sub) msgs.push('제출했습니다. 자기점검 항목이 열렸습니다.');
       say(msgs.join(' '));}
      break;}
    case 'pick': {const s=ps(id),k=b.dataset.k,v=b.dataset.v;
      if(b.dataset.multi==='1'){const arr=Array.isArray(s.v[k])?s.v[k].slice():[]; const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); s.v[k]=arr;}
      else s.v[k]=v;
      s.res=null; save(); rerenderPart(id); break;}
    case 'key': {
      let el=lastNum?document.getElementById(lastNum):null;
      const part=document.getElementById('part-'+id);
      if(!el||!part||!part.contains(el)) el=part&&part.querySelector('input.num');
      if(!el) break;
      const ch=b.dataset.ch;
      const a0=el.selectionStart??el.value.length, b0=el.selectionEnd??a0;
      el.value=el.value.slice(0,a0)+ch+el.value.slice(b0);
      const pos=a0+ch.length;
      ps(id).v[el.dataset.k]=el.value; save();
      el.focus(); try{el.setSelectionRange(pos,pos)}catch(e){}
      lastNum=el.id;
      break;}
    case 'cell': {const s=ps(id); s.v[b.dataset.k]=b.dataset.v; s.res=null; save(); rerenderPart(id); break;}
    case 'mode': {const s=ps(id); s.note=b.dataset.v==='note'; save(); rerenderPart(id); break;}
    case 'idk': {const s=ps(id); s.tried=true; s.hint=Math.max(s.hint,1); save(); rerenderPart(id); const h=partById(id).hints[0]; say('힌트 1단계: '+plain(h&&h.t||'')); if(h&&h.ref) showRef(h.ref); break;}
    case 'hint': {const s=ps(id); s.hint=Math.min(2,s.hint+1); save(); rerenderPart(id); const h=partById(id).hints[s.hint-1]; say(`힌트 ${s.hint}단계: `+plain(h&&h.t||'')); if(s.hint===1&&h&&h.ref) showRef(h.ref); break;}
    case 'ref': showRef(b.dataset.ref); break;
    case 'model': {ps(id).model=true; save(); rerenderPart(id); say('모범 답안을 열었습니다.'); break;}
    case 'toc-open': openToc(); break;
    case 'toc-close': closeToc(); break;
    case 'toc-go': {closeToc(); ui.act=+b.dataset.i; ui.screen='act'; ts().last=ui.act; save(); render(); break;}
    case 'sheet-open': openSheet(); break;
    case 'sheet-close': closeSheet(); break;
    case 'zoom': {const fg=b.closest('figure'), fc=fg&&fg.querySelector('figcaption');
      openZoom(b.dataset.fig, fc?fc.innerHTML:''); break;}
    case 'zf': zfi=Math.max(0,Math.min(ZF.length-1,zfi+(+b.dataset.d))); applyZF(); break;
    case 'unzoom': closeZoom(); break;
    case 'reset':
      if(!resetArmed){resetArmed=true; b.textContent='한 번 더 누르면 지워진다'; setTimeout(()=>{resetArmed=false; if(b.isConnected) b.textContent='이 주제 기록 지우기';},3000); return;}
      resetArmed=false; delete store[ui.topic]; save(); ui.screen='intro'; render(); break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!zoom.hidden) closeZoom(); else if(!tocEl.hidden) closeToc(); else closeSheet();}});
render();
</script>
